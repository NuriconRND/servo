<!doctype html>
<meta charset="utf-8">
<title>Multi-GPU Virtual Viewport Probe</title>
<style>
  :root {
    color-scheme: dark;
    font: 14px/1.45 system-ui, sans-serif;
    background: #121418;
    color: #e9edf2;
  }

  body {
    margin: 0;
    min-height: 2200px;
    background:
      linear-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.08) 1px, transparent 1px),
      linear-gradient(90deg, #151820 0 33.333%, #18201b 33.333% 66.666%, #201a18 66.666%);
    background-size: 160px 160px, 160px 160px, 100% 100%;
  }

  header {
    position: fixed;
    z-index: 10;
    inset: 0 0 auto 0;
    padding: 14px 18px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(18, 20, 24, 0.94);
  }

  main {
    padding: 106px 18px 40px;
  }

  h1 {
    margin: 0 0 8px;
    font-size: 18px;
    font-weight: 700;
  }

  .metrics {
    display: grid;
    grid-template-columns: repeat(4, minmax(180px, 1fr));
    gap: 8px;
  }

  .metric,
  .log {
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(0, 0, 0, 0.24);
    padding: 8px 10px;
  }

  .label {
    display: block;
    color: #9da7b4;
    font-size: 11px;
    text-transform: uppercase;
  }

  .value {
    font: 700 16px/1.3 ui-monospace, SFMono-Regular, Consolas, monospace;
  }

  .tile-marker {
    position: absolute;
    top: 720px;
    height: 340px;
    width: 1px;
    background: #f8d847;
    box-shadow: 0 0 0 1px #f8d847;
  }

  .tile-marker::before {
    content: attr(data-label);
    position: absolute;
    top: -26px;
    left: 8px;
    white-space: nowrap;
    color: #f8d847;
    font: 700 13px/1 ui-monospace, SFMono-Regular, Consolas, monospace;
  }

  #marker-1920 {
    left: 1920px;
  }

  #marker-3840 {
    left: 3840px;
  }

  #event-log {
    max-width: 920px;
    font: 13px/1.45 ui-monospace, SFMono-Regular, Consolas, monospace;
    white-space: pre-wrap;
  }
</style>
<header>
  <h1>Multi-GPU Virtual Viewport Probe</h1>
  <div class="metrics" id="metrics"></div>
</header>
<main>
  <p>Click, wheel, and touch anywhere. The event log should report virtual viewport coordinates.</p>
  <pre class="log" id="event-log">waiting for input...</pre>
  <div class="tile-marker" id="marker-1920" data-label="x=1920"></div>
  <div class="tile-marker" id="marker-3840" data-label="x=3840"></div>
</main>
<script>
  const metrics = document.getElementById("metrics");
  const eventLog = document.getElementById("event-log");
  const entries = [];

  function metric(label, value) {
    return `<div class="metric"><span class="label">${label}</span><span class="value">${value}</span></div>`;
  }

  function updateMetrics() {
    const visual = window.visualViewport;
    metrics.innerHTML = [
      metric("inner", `${window.innerWidth} x ${window.innerHeight}`),
      metric("outer", `${window.outerWidth} x ${window.outerHeight}`),
      metric("devicePixelRatio", window.devicePixelRatio),
      metric("screen", `${screen.width} x ${screen.height}`),
      metric("avail", `${screen.availWidth} x ${screen.availHeight}`),
      metric("screen origin", `${window.screenX}, ${window.screenY}`),
      metric("scroll", `${Math.round(scrollX)}, ${Math.round(scrollY)}`),
      metric("visual", visual ? `${Math.round(visual.width)} x ${Math.round(visual.height)}` : "n/a"),
    ].join("");
  }

  function logPoint(type, point, extra = "") {
    const line = [
      new Date().toLocaleTimeString(),
      type,
      `client=${Math.round(point.clientX || 0)},${Math.round(point.clientY || 0)}`,
      `page=${Math.round(point.pageX || 0)},${Math.round(point.pageY || 0)}`,
      `screen=${Math.round(point.screenX || 0)},${Math.round(point.screenY || 0)}`,
      extra,
    ].filter(Boolean).join(" | ");
    entries.unshift(line);
    entries.length = Math.min(entries.length, 18);
    eventLog.textContent = entries.join("\n");
    updateMetrics();
  }

  function logEvent(event) {
    const extra = "deltaY" in event ? `delta=${Math.round(event.deltaX)},${Math.round(event.deltaY)}` : "";
    logPoint(event.type, event, extra);
  }

  updateMetrics();
  addEventListener("resize", updateMetrics);
  addEventListener("scroll", updateMetrics);
  addEventListener("click", logEvent);
  addEventListener("mousedown", logEvent);
  addEventListener("wheel", logEvent, { passive: true });
  addEventListener("touchstart", (event) => logPoint("touchstart", event.touches[0]));
  addEventListener("touchmove", (event) => logPoint("touchmove", event.touches[0]), { passive: true });
</script>
