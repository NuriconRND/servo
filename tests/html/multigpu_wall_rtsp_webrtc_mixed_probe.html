<!DOCTYPE html>
<!--
  Triple-source mixed probe (for local_2x1, virtual viewport 3840x1080, seam x=1920):
    - CENTER (on the seam, stacked): <rtsp-stream> (top) and WebRTC <video> (bottom),
      BOTH straddling x=1920 so each splits across tile 0 / tile 1.
    - LEFT  (tile 0) and RIGHT (tile 1): standard, spec-compliant web content
      (CSS anim, SVG, JS clock/counter) flanking the two videos.

  WebRTC consumes a producer published to the gst-plugins-rs default signalling
  server (ws://127.0.0.1:8443). Producer is the OFFERER, browser ANSWERs.
  Optional query params: ?signaling=ws://host:port  ?producer=<producerId>

  Run (three terminals):
    1) gst-webrtc-signalling-server
    2) a producer, e.g. gst-launch-1.0 videotestsrc is-live=true ! videoconvert ! \
         webrtcsink signaller::uri=ws://127.0.0.1:8443
    3) <servoshell> --wall-layout ..\config\wall_layout.local_2x1.json --wall-all-tiles \
         --pref dom_webrtc_enabled=true --pref dom_webrtc_transceiver_enabled=true \
         --pref dom_rtsp_stream_enabled=true \
         tests\html\multigpu_wall_rtsp_webrtc_mixed_probe.html
  (target\release\servoshell.exe recommended.)
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WebRTC + RTSP on seam + standard (2x1)</title>
  <style>
    :root { --accent:#4aa3ff; --accent2:#2ecc40; --accent3:#ff8c42; --accent4:#c56cf0; }
    * { box-sizing:border-box; }
    html, body { margin:0; padding:0; background:#0b0d12; }
    body { width:3840px; height:1080px; position:relative; overflow:hidden;
           font-family:system-ui,"Segoe UI",sans-serif; color:#e8e8f0; }
    #overlap { position:absolute; left:1888px; top:0; width:64px; height:1080px; background:rgba(255,59,59,.10); z-index:4; }
    #seam    { position:absolute; left:1919px; top:0; width:2px; height:1080px; background:#ff3b3b; z-index:5; }

    .pane { position:absolute; top:0; height:1080px; padding:36px; }
    .pane h2 { font-size:32px; margin:0 0 18px; }
    #left  { left:40px;   width:1520px; background:linear-gradient(135deg,#10131c,#1a2030); }
    #right { left:2280px; width:1520px; background:linear-gradient(225deg,#10131c,#2a1a26); }
    .tag { font-size:15px; font-weight:700; padding:3px 9px; border-radius:999px; }
    .tag.wrtc{ background:rgba(197,108,240,.18); color:var(--accent4); }
    .tag.std { background:rgba(74,163,255,.18); color:var(--accent); }
    .tag.non { background:rgba(46,204,64,.18); color:var(--accent2); }

    .clock { font-variant-numeric:tabular-nums; font-size:56px; font-weight:800; color:var(--accent);
             text-shadow:0 0 16px rgba(74,163,255,.5); }
    .sub { font-size:20px; color:#9aa; }
    .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:18px; margin:24px 0; }
    .card { height:120px; border-radius:14px; padding:14px; font-size:22px; font-weight:700; display:flex; align-items:flex-end;
            box-shadow:0 6px 16px rgba(0,0,0,.5); }
    #left .card { background:linear-gradient(160deg,#2a3350,#3a2a55); }
    #right .card{ background:linear-gradient(160deg,#55322a,#3a2a55); }
    .card:nth-child(odd){ animation:float 3s ease-in-out infinite; } .card:nth-child(even){ animation:float 3s ease-in-out infinite reverse; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-14px)} }
    .squares { display:flex; gap:16px; margin:24px 0; }
    .sq { width:60px; height:60px; border-radius:10px; background:var(--accent3); animation:spin 2.4s ease-in-out infinite; }
    .sq:nth-child(2){animation-delay:.2s}.sq:nth-child(3){animation-delay:.4s}.sq:nth-child(4){animation-delay:.6s}
    @keyframes spin { 0%,100%{transform:rotate(0) scale(1)} 50%{transform:rotate(180deg) scale(1.3)} }

    /* Both media regions straddle the seam (left 1600..2240, centered on x=1920), stacked. */
    .seam-label { position:absolute; left:1600px; width:640px; text-align:center; font-size:20px; font-weight:700; z-index:6; }
    .seam-status{ position:absolute; left:1600px; width:640px; text-align:center; font-family:monospace; font-size:16px; z-index:6; }

    #s { position:absolute; left:1600px; top:130px; width:640px; height:360px; background:#000; border:3px solid var(--accent2);
         border-radius:6px; box-shadow:0 0 30px rgba(46,204,64,.4); z-index:6; }
    #rlabel  { top:86px;  color:var(--accent2); }
    #rstatus { top:500px; color:#9fd; }

    #wrtc { position:absolute; left:1600px; top:574px; width:640px; height:360px; background:#000; border:3px solid var(--accent4);
            border-radius:6px; box-shadow:0 0 30px rgba(197,108,240,.4); z-index:6; }
    #wlabel  { top:530px; color:var(--accent4); }
    #wstatus { top:944px; color:#e6c8ff; }
  </style>
</head>
<body>
  <div id="overlap"></div>
  <div id="seam"></div>

  <!-- LEFT: standard content (tile 0) -->
  <section class="pane" id="left">
    <h2>Standard content ◂ tile 0 <span class="tag std">CSS/JS/SVG</span></h2>
    <div style="display:flex; align-items:center; gap:24px;">
      <svg width="96" height="96" viewBox="0 0 100 100">
        <circle cx="50" cy="50" r="40" fill="none" stroke="#2a3350" stroke-width="10"/>
        <path d="M50 10 a40 40 0 0 1 40 40" fill="none" stroke="#4aa3ff" stroke-width="10" stroke-linecap="round">
          <animateTransform attributeName="transform" type="rotate" from="0 50 50" to="360 50 50" dur="1.1s" repeatCount="indefinite"/>
        </path>
      </svg>
      <div><div class="clock" id="clock">--:--:--</div><div class="sub">rAF: <span id="raf">0</span></div></div>
    </div>
    <div class="grid"><div class="card">#1</div><div class="card">#2</div><div class="card">#3</div><div class="card">#4</div></div>
  </section>

  <!-- CENTER: both videos straddling the seam, stacked -->
  <div class="seam-label" id="rlabel">&lt;rtsp-stream&gt; on seam (x=1920) <span class="tag non">RTSP</span></div>
  <rtsp-stream id="s" src="rtsp://127.0.0.1:8554/test" width="640" height="360"></rtsp-stream>
  <div class="seam-status" id="rstatus">rtsp: starting…</div>

  <div class="seam-label" id="wlabel">WebRTC on seam (x=1920) <span class="tag wrtc">&lt;video srcObject&gt;</span></div>
  <video id="wrtc" autoplay muted playsinline></video>
  <div class="seam-status" id="wstatus">webrtc: idle</div>

  <!-- RIGHT: standard content (tile 1) -->
  <section class="pane" id="right">
    <h2>tile 1 ▸ Standard content <span class="tag std">CSS anim</span></h2>
    <div class="squares"><div class="sq"></div><div class="sq"></div><div class="sq"></div><div class="sq"></div></div>
    <div class="clock" id="counter" style="color:var(--accent3)">0</div>
    <div class="sub">setInterval counter</div>
    <div class="grid"><div class="card">A</div><div class="card">B</div><div class="card">C</div><div class="card">D</div></div>
  </section>

  <script>
    // ---------- standard DOM/JS ----------
    const clock=document.getElementById('clock');
    setInterval(()=>{const d=new Date();clock.textContent=[d.getHours(),d.getMinutes(),d.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':');},250);
    let cN=0; const counter=document.getElementById('counter'); setInterval(()=>counter.textContent=++cN,250);
    let raf=0; const rafEl=document.getElementById('raf'); (function t(){raf++; if(raf%10===0) rafEl.textContent=raf; requestAnimationFrame(t);})();

    // ---------- RTSP (non-standard), straddling seam ----------
    const rel=document.getElementById('s'), rstatus=document.getElementById('rstatus');
    if(rel instanceof RtspStreamElement){ rel.play(); rstatus.textContent="rtsp: play()";
      setInterval(()=>{ rstatus.textContent=`rtsp: ${rel.videoWidth}x${rel.videoHeight} playing=${rel.playing}`; },2000);
    } else { rstatus.textContent="rtsp: <rtsp-stream> unavailable (pref?)"; }

    // ---------- WebRTC consumer (gst-plugins-rs default signalling), straddling seam ----------
    const params = new URLSearchParams(location.search);
    const SIGNALING = params.get('signaling') || 'ws://127.0.0.1:8443';
    const FORCE_PRODUCER = params.get('producer') || null;
    const wv = document.getElementById('wrtc'), ws_el = document.getElementById('wstatus');
    let ws, pc, sessionId=null, ourId=null, consuming=false;
    const wlog = (m) => { console.log("RTSP_WEBRTC "+m); ws_el.textContent = "webrtc: "+m; };
    const send = (o) => { try { ws.send(JSON.stringify(o)); } catch(e){ wlog("send fail "+e); } };

    function connect(){
      wlog("connecting "+SIGNALING);
      ws = new WebSocket(SIGNALING);
      ws.onopen = () => wlog("ws open");
      ws.onerror = () => wlog("ws error");
      ws.onclose = () => wlog("ws closed");
      ws.onmessage = onMessage;
    }
    async function onMessage(ev){
      let msg; try { msg = JSON.parse(ev.data); } catch(e){ return; }
      switch(msg.type){
        case 'welcome':
          ourId = msg.peerId; wlog("welcome id="+ourId);
          send({type:'setPeerStatus', roles:['Listener']});
          send({type:'list'});
          if(FORCE_PRODUCER) startConsume(FORCE_PRODUCER);
          break;
        case 'list':
          if(!consuming && msg.producers && msg.producers.length){ startConsume(msg.producers[0].id); }
          else if(!consuming){ wlog("no producers yet — waiting"); }
          break;
        case 'peerStatusChanged':
          if(!consuming && msg.peerId && msg.roles && msg.roles.includes('Producer')){ startConsume(msg.peerId); }
          break;
        case 'sessionStarted':
          sessionId = msg.sessionId; wlog("session "+sessionId+" (awaiting offer)");
          break;
        case 'startSession':
          sessionId = msg.sessionId || sessionId;
          if(msg.offer) await handleOffer(msg.offer);
          break;
        case 'peer':
          if(msg.sdp){ await handleOffer(msg.sdp); }
          else if(msg.ice && pc){ try{ await pc.addIceCandidate({candidate:msg.ice.candidate, sdpMLineIndex:msg.ice.sdpMLineIndex}); }catch(e){ wlog("addIce fail "+e); } }
          break;
        case 'endSession': wlog("session ended"); cleanup(); break;
        case 'error': wlog("server error: "+(msg.details||'')); break;
      }
    }
    function startConsume(producerId){ consuming=true; wlog("startSession -> producer "+producerId); newPc(); send({type:'startSession', peerId: producerId}); }
    function newPc(){
      pc = new RTCPeerConnection();
      pc.ontrack = (e) => {
        const stream = (e.streams && e.streams.length) ? e.streams[0] : new MediaStream([e.track]);
        wv.srcObject = stream;
        wlog("ontrack ("+(e.track && e.track.kind)+") — attached");
      };
      pc.onicecandidate = (e) => { if(e.candidate && sessionId) send({type:'peer', sessionId, ice:{candidate:e.candidate.candidate, sdpMLineIndex:e.candidate.sdpMLineIndex}}); };
      pc.onconnectionstatechange = () => wlog("pc "+pc.connectionState);
    }
    async function handleOffer(sdp){
      try {
        if(!pc) newPc();
        await pc.setRemoteDescription({type: sdp.type || 'offer', sdp: sdp.sdp});
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        send({type:'peer', sessionId, sdp:{type:'answer', sdp: pc.localDescription.sdp}});
        wlog("sent answer; negotiating…");
      } catch(e){ wlog("offer/answer fail "+e); }
    }
    function cleanup(){ if(pc){ try{pc.close();}catch(e){} pc=null; } sessionId=null; consuming=false; }

    if (typeof RTCPeerConnection === 'undefined') { wlog("RTCPeerConnection unavailable — is dom_webrtc_enabled set?"); }
    else { connect(); }
  </script>
</body>
</html>
