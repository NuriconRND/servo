<!doctype html>
<!--
  RTSP teardown probe — does removing the <video> element actually tear the stream down,
  and does anything stay on screen afterwards?

  Two reported symptoms this page is built to observe:
    1. removing the element leaves the RTSP session ESTABLISHED (the camera keeps it open);
    2. a ghost of the last frame intermittently stays on the wall after removal.

  ★TIME-DRIVEN ON PURPOSE — do not add buttons.★ `winit_wall` deliberately omits input
  coordinate remapping (see its module header), so clicks never land where you think they
  do. Everything here runs off a timeline instead:

      t=0s    insert <video src="rtsp://…"> into the stage
      t=8s    element.remove()  — the DOM removal under test
      t=12s   drop the last JS reference to it, so only GC could still reach it
      t≥12s   keep reporting, so a capture taken later shows the post-removal state

  The stage keeps its exact size and position after removal. That is the point: if the box
  is empty you are looking at a clean teardown; if the last video frame is still sitting
  there, that is symptom 2, and its outline will line up exactly with the dashed stage.

  HOW TO SEE SYMPTOM 1 — the page cannot observe network state, so watch it from outside
  while this runs (RTSP is TCP for control even when media is UDP):

      netstat -ano | Select-String "<camera-ip>"

  Poll it before t=8 and again well after. A connection still ESTABLISHED after removal is
  the bug. `[teardown-probe]` lines below are also written to the console.

  Run with the project's standard flag set (see the run recipe); the ones that matter most
  here are `gfx_dcomp_mode=surface` (the residual-frame path differs completely between the
  DComp compositor and the GL one) and `dom_video_network_uri_enabled=true`.

      target\release\examples\winit_wall.exe --wall-all-tiles ^
        --wall-layout ..\config\wall_layout.local_1x1.json ^
        <standard flags> --capture teardown.png --capture-sec 20 ^
        "file:///W:/servo_multigpu-tiled-wall/tests/html/rtsp_teardown_probe.html?src=rtsp://user:pass@host:port"

  Capture AFTER t=12s so the shot shows the post-removal state, not the playing one.
-->
<html lang="en"><head><meta charset="utf-8"><title>rtsp teardown probe</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: #0b0d12;
               font-family: system-ui, "Segoe UI", sans-serif; color: #e8e8f0; }
  body { display: flex; flex-direction: column; padding: 24px; gap: 18px; }

  header h1 { font-size: 22px; margin: 0 0 4px; }
  header .sub { font-size: 14px; color: #9aa; margin: 0; }
  header .sub b { color: #c56cf0; }

  /* flex, not CSS Grid — Servo gates Grid behind `layout_grid_enabled`, which defaults to
     false, so `display: grid` silently falls back to block and columns stack vertically. */
  .cols { display: flex; gap: 24px; flex: 1 1 auto; min-height: 0; }

  /* ★The stage keeps its geometry after the video is removed.★ A ghost frame will land
     exactly inside this dashed outline, which is what makes symptom 2 unambiguous rather
     than "something looks off". */
  .stage { position: relative; width: 960px; height: 540px; flex: 0 0 auto;
           border: 2px dashed #4a5170; border-radius: 6px; overflow: hidden;
           background: #11131b; }
  .stage video { width: 100%; height: 100%; display: block; background: #f4f4f8; }
  .stage .empty-marker { position: absolute; inset: 0; display: flex;
                         align-items: center; justify-content: center;
                         font-size: 20px; color: #4a5170; letter-spacing: .08em; }

  .side { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .phase { font-size: 26px; font-weight: 800; }
  .phase.playing { color: #2ecc71; }
  .phase.removed { color: #ff9f45; }
  .phase.released { color: #c56cf0; }
  #log { flex: 1 1 auto; min-height: 0; overflow: hidden; font-family: monospace;
         font-size: 15px; line-height: 1.55; color: #cfd3e1;
         background: #10131c; border: 1px solid #262b3a; border-radius: 6px; padding: 12px; }
  #log div.hit { color: #ffd93b; }
</style></head>
<body>
  <header>
    <h1>rtsp teardown probe</h1>
    <p class="sub">insert → <b>remove at t=8s</b> → drop reference at t=12s. The dashed box
       keeps its place; anything still drawn inside it after removal is a leftover frame.</p>
  </header>

  <div class="cols">
    <div class="stage" id="stage">
      <div class="empty-marker" id="marker">stage empty — video not inserted yet</div>
    </div>
    <div class="side">
      <div class="phase" id="phase">t=0s · starting</div>
      <div id="log"></div>
    </div>
  </div>

  <script>
    // ★No camera URL is committed here★ — the real ones carry credentials. Pass the
    // stream as `?src=rtsp://user:pass@host:port`; without it the page shows what to do
    // rather than silently probing nothing.
    const RTSP_URL = new URLSearchParams(location.search).get("src");

    const REMOVE_AT_S = 8;    // DOM removal under test
    const RELEASE_AT_S = 12;  // drop the JS reference, leaving GC as the only path

    const stage = document.getElementById("stage");
    const marker = document.getElementById("marker");
    const phaseEl = document.getElementById("phase");
    const logEl = document.getElementById("log");

    const t0 = performance.now();
    const secs = () => ((performance.now() - t0) / 1000);

    function log(msg, hit) {
      const line = "t=" + secs().toFixed(1) + "s  " + msg;
      console.log("[teardown-probe] " + line);
      const d = document.createElement("div");
      if (hit) d.className = "hit";
      d.textContent = line;
      logEl.append(d);
      while (logEl.childNodes.length > 22) logEl.removeChild(logEl.firstChild);
    }

    if (!RTSP_URL) {
      marker.textContent = "no ?src= given — append ?src=rtsp://user:pass@host:port";
      phaseEl.textContent = "idle";
      log("no ?src= query parameter — nothing to probe", true);
      throw new Error("rtsp_teardown_probe: missing ?src=");
    }

    // Held only until RELEASE_AT_S, then nulled so nothing but GC can still reach it.
    let video = document.createElement("video");
    video.id = "rtspVideo";
    video.autoplay = true;
    video.muted = true;
    video.setAttribute("playsinline", "");
    video.addEventListener("loadedmetadata", () =>
      log("loadedmetadata " + video.videoWidth + "x" + video.videoHeight));
    video.addEventListener("error", () =>
      log("error event, code=" + (video.error ? video.error.code : "?"), true));
    video.src = RTSP_URL;

    marker.remove();
    stage.append(video);
    log("inserted <video src=" + RTSP_URL.replace(/\/\/.*@/, "//***@") + ">");

    let removed = false, released = false;

    setInterval(() => {
      const t = secs();

      if (!removed && t >= REMOVE_AT_S) {
        removed = true;
        // The DOM removal under test. Deliberately nothing else — no pause(), no
        // src="", no load(). Those would mask whether removal alone tears down.
        video.remove();
        const m = document.createElement("div");
        m.className = "empty-marker";
        m.id = "marker";
        m.textContent = "video removed from DOM — this box should be empty";
        stage.append(m);
        phaseEl.className = "phase removed";
        log("video.remove() called — element detached from the document", true);
      }

      if (!released && t >= RELEASE_AT_S) {
        released = true;
        video = null;
        phaseEl.className = "phase released";
        log("dropped the last JS reference — only GC can reach the player now", true);
      }

      const phase = !removed ? "playing" : (!released ? "removed (ref still held)"
                                                      : "removed + reference dropped");
      phaseEl.textContent = "t=" + t.toFixed(0) + "s · " + phase;

      // While we still hold it, report whether it is actually advancing. After removal a
      // detached element can keep playing — that is exactly what we are looking for.
      if (video) {
        const ct = video.currentTime;
        const adv = window.__lastCt !== undefined && ct > window.__lastCt + 0.001;
        window.__lastCt = ct;
        if (Math.round(t * 2) % 4 === 0) {
          log("currentTime=" + ct.toFixed(2) + (adv ? " advancing" : " NOT advancing")
              + " readyState=" + video.readyState + (removed ? " [detached]" : ""));
        }
      }
    }, 500);
  </script>
</body></html>
