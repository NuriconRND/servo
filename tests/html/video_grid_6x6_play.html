<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>6x6 Video Wall</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  /* CSS Grid 대신 flex-wrap 사용: Servo grid 구현이 video 내재 크기(1920x1080)로
     트랙 blowout 되는 문제 회피 (video_grid_6x6_perf.html과 동일 기법).
     타일 크기는 JS에서 vw/vh로 명시 지정. */
  #grid {
    display: flex;
    flex-wrap: wrap;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
  }
  #grid video {
    box-sizing: border-box;
    flex: 0 0 auto;
    /* fill: aspect ratio 무시하고 타일을 꽉 채움 (크롭 없이 프레임 전체 표시) */
    object-fit: fill;
    background: #000;
  }
  /* rAF 하트비트용 (사실상 안 보이는 2px 점) — 아래 스크립트 주석 참조 */
  #hb {
    position: fixed;
    right: 0;
    bottom: 0;
    width: 2px;
    height: 2px;
    background: #000;
    z-index: 10;
  }
  /* 동기 시작 전까지 준비 과정(프리롤/웜업/정렬)을 가리는 커버.
     전 타일의 동기 재생이 확인되는 순간 제거된다. */
  #cover {
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #555;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 24px;
  }
</style>
</head>
<body>
<div id="grid"></div>
<div id="hb"></div>
<div id="cover">준비 중...</div>
<script>
  "use strict";

  // 그리드 크기 파라미터 (perf 페이지와 동일):
  //   ?grid=N        -> N x N (정사각, 기본 6 => 36 타일)
  //   ?cols=C&rows=R -> C열 x R행 직사각 (예: cols=9&rows=5 => 45 타일)
  const params = new URLSearchParams(location.search);
  const clampInt = (raw, fallback) => {
    const n = parseInt(raw, 10);
    return Number.isFinite(n) ? Math.max(1, Math.min(16, n)) : fallback;
  };
  const gridN = clampInt(params.get("grid"), 6);
  const COLS = clampInt(params.get("cols"), gridN);
  const ROWS = clampInt(params.get("rows"), gridN);
  const TILE_COUNT = COLS * ROWS;
  const SRC = "../Wildlife_FHD30fps_counter_10Mbitrate.mp4";
  document.title = COLS + "x" + ROWS + " Video Wall";

  const grid = document.getElementById("grid");
  const tileW = (100 / COLS) + "vw";
  const tileH = (100 / ROWS) + "vh";

  // 독립 <video> 생성. 각 엘리먼트가 동일 파일을 개별 디코딩/루프 재생.
  // 동기 시작: 즉시 재생하지 않고(autoplay 없음) 전 타일이 첫 프레임까지 프리롤된 뒤
  // 한꺼번에 play한다. 수십 개 파이프라인이 기동 경쟁 중에 재생을 시작하면 타일마다
  // 다른 시점에 멈칫거리며 출발해 영구적인 재생 시차(수십 프레임)가 생기기 때문.
  const videos = [];
  for (let i = 0; i < TILE_COUNT; i++) {
    const v = document.createElement("video");
    v.muted = true;         // 자동재생 정책상 muted 필수
    v.loop = true;
    v.playsInline = true;
    v.preload = "auto";
    v.style.width = tileW;
    v.style.height = tileH;
    v.src = SRC;
    v.play().catch(() => {});
    grid.appendChild(v);
    videos.push(v);
  }

  // 시작 동기화는 백엔드 동기 그룹(env SERVO_MEDIA_SYNC_GROUP=타일수)이 담당한다:
  // 각 파이프라인은 프리롤 후 보류되고, 전원이 준비되면 공유 클럭 + 동일 base time으로
  // 동시에 출발한다(프레임 단위 lockstep). gapless 루프(SERVO_MEDIA_GAPLESS_LOOP)가
  // non-flush 되감기로 그 위상을 영구 보존한다. 페이지는 재생 요청만 하고, 전 타일의
  // 동시 출발이 관측되면 준비 과정을 가리던 커버를 걷는다.
  // 공개 시점: 조건 기반 — 전 타일의 실제 재생 시작(currentTime 전진)이 관측되는
  // 순간 커버를 걷는다. 임의의 지연/은폐 없음. 90초는 오류 시 안전장치일 뿐이다.
  const cover = document.getElementById("cover");
  const syncBegin = performance.now();
  const revealPoll = setInterval(() => {
    const moving = videos.filter((v) => v.currentTime > 0).length;
    const elapsed = ((performance.now() - syncBegin) / 1000) | 0;
    cover.textContent = "준비 중... " + moving + "/" + TILE_COUNT + " (" + elapsed + "s)";
    if (moving >= TILE_COUNT || elapsed > 90) {
      clearInterval(revealPoll);
      if (cover.parentNode) cover.parentNode.removeChild(cover);
    }
  }, 250);

  // rAF 하트비트: 매 프레임 최소 DOM 변경으로 페이지를 '애니메이션 중' 상태로 유지.
  // rAF가 없으면 Servo는 36개 비디오의 프레임 도착(~1080건/s)마다 개별 즉시-합성
  // 경로(painter.rs update_images)를 타는데, 이 이벤트 폭주가 winit 이벤트 루프를
  // 압도해 창 이동/포커스 같은 OS 메시지가 몇 분씩 굶주린다(창이 안 움직임/전면으로
  // 안 옴). rAF가 활성이면 그 경로가 억제되고 일정한 합성 주기를 타므로(검증된
  // video_grid_6x6_perf.html과 동일 동작) 하트비트로 항상 rAF를 돌린다.
  // 주의: 빈 rAF 콜백은 페인트를 보장하지 않으므로 2px 점의 색을 매 프레임
  // 미세하게 바꿔 실제 페인트를 강제한다 (perf 페이지의 stats 텍스트 갱신과 동일 역할).
  const hb = document.getElementById("hb");
  let hbFrame = 0;
  (function heartbeat() {
    hbFrame++;
    hb.style.background = (hbFrame & 1) ? "#000001" : "#000000";
    requestAnimationFrame(heartbeat);
  })();
</script>
</body>
</html>
