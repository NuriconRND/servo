<!DOCTYPE html>
<!--
  Perf-investigation page: 4x4 = 16 <video> tiles, ONE page, ONE logical surface.
  Source is an FHD 30fps H.264 mp4 (the slow case under investigation).
  Used with a single-tile wall layout (example_1x1) to isolate the single-compositor
  cost: per-second "Render perf" lines from servo-paint attribute upload vs draw vs FPS.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Perf video grid — 4x4 FHD30</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    #grid { display: flex; flex-wrap: wrap; align-content: flex-start; width: 100vw; height: 100vh; }
    .cell { flex: none; position: relative; overflow: hidden; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.15); }
    .cell video { width: 100%; height: 100%; object-fit: fill; display: block; background: #111; }
    .label { position: absolute; top: 2px; left: 2px; font: 14px/1.2 monospace; color: #0f0;
             background: rgba(0,0,0,0.55); padding: 1px 4px; pointer-events: none; }
  </style>
</head>
<body>
  <div id="grid"></div>

  <script>
    // === EDIT HERE: one source for all tiles ===========================
    const VIDEO_SRC = "file:///F:/20260609_SDWall_BrowserTest/20260606_multigpu_browser/servo/tests/Wildlife_FHD30fps_counter_10Mbitrate.mp4";
    // ===================================================================
    const COLS = 4, ROWS = 4;

    const grid = document.getElementById("grid");
    const cellWidth = 100 / COLS + "%";
    const cellHeight = 100 / ROWS + "%";

    const total = COLS * ROWS;
    for (let i = 0; i < total; i++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.style.width = cellWidth;
      cell.style.height = cellHeight;

      const video = document.createElement("video");
      video.src = VIDEO_SRC;
      video.muted = true;
      video.loop = true;
      video.autoplay = true;
      video.playsInline = true;
      video.setAttribute("muted", "");
      video.setAttribute("playsinline", "");
      video.addEventListener("canplay", () => { video.play().catch(() => {}); });

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = i + 1;

      cell.appendChild(video);
      cell.appendChild(label);
      grid.appendChild(cell);
    }
  </script>
</body>
</html>
