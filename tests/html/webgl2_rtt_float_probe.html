<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>webgl2 render-to-float probe</title>
<style>html,body{margin:0;height:100%;background:#222;color:#eee;font:13px monospace}#log{padding:8px;white-space:pre}</style></head>
<body><div id="log"></div>
<script>
// PMREM 핵심 경로 검증: RGBA16F/RGBA32F 렌더타깃에 빨강을 그린 뒤, 그걸 샘플해 화면으로 읽어온다.
// 결과 픽셀이 빨강이면 render-to-float 정상, 검정이면 깨짐(= PMREM/IBL 검정의 원인).
const gl=document.createElement('canvas').getContext('webgl2');
const out=document.getElementById('log'); let L=[];
function log(m){ L.push(m); out.textContent=L.join('\n'); try{console.log('[RTT] '+m)}catch(e){} }
if(!gl){ log('NO webgl2'); throw 'no'; }
const extF=gl.getExtension('EXT_color_buffer_float');
const extHF=gl.getExtension('EXT_color_buffer_half_float');
log('EXT_color_buffer_float='+!!extF+'  EXT_color_buffer_half_float='+!!extHF);
function glErr(t){ let e,a=[]; while((e=gl.getError())){ a.push('0x'+e.toString(16)); } if(a.length) log(t+' ERR '+a.join(',')); return a.length; }

function testRTT(name, internalFmt, type){
  const W=8,H=8;
  // 1) 렌더타깃 텍스처
  const rt=gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D,rt);
  gl.texImage2D(gl.TEXTURE_2D,0,internalFmt,W,H,0,gl.RGBA,type,null);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST); gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
  glErr(name+' texImage');
  const fbo=gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER,fbo);
  gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,rt,0);
  const st=gl.checkFramebufferStatus(gl.FRAMEBUFFER);
  log(name+' FBO status=0x'+st.toString(16)+' complete='+(st===gl.FRAMEBUFFER_COMPLETE));
  if(st!==gl.FRAMEBUFFER_COMPLETE){ gl.bindFramebuffer(gl.FRAMEBUFFER,null); return; }
  // 2) 빨강(2.0, HDR) 클리어 — float이므로 1 초과 가능
  gl.viewport(0,0,W,H); gl.clearColor(2.0,0.0,0.0,1.0); gl.clear(gl.COLOR_BUFFER_BIT); glErr(name+' clear');
  // 3) 그 텍스처를 기본 프레임버퍼(RGBA8)로 샘플해서 그린 뒤 readPixels
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
  const cw=gl.drawingBufferWidth, chh=gl.drawingBufferHeight; gl.viewport(0,0,cw,chh);
  gl.useProgram(prog); gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D,rt);
  gl.uniform1i(uLoc,0); gl.bindVertexArray(vao);
  gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT); gl.drawArrays(gl.TRIANGLES,0,3); glErr(name+' sample-draw');
  const px=new Uint8Array(4); gl.readPixels((cw/2)|0,(chh/2)|0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,px);
  log(name+' sampled centerPixel=['+px[0]+','+px[1]+','+px[2]+'] '+(px[0]>200?'(빨강 OK)':'(검정/깨짐!)'));
}
// 샘플 셰이더(텍스처를 그대로 출력, 톤매핑 없이)
const vs=`#version 300 es
in vec2 p; out vec2 uv; void main(){ uv=p*0.5+0.5; gl_Position=vec4(p,0.,1.); }`;
const fs=`#version 300 es
precision highp float; in vec2 uv; uniform sampler2D t; out vec4 o; void main(){ vec3 c=texture(t,uv).rgb; o=vec4(min(c,vec3(1.0)),1.0); }`;
function sh(t,s){ const o=gl.createShader(t); gl.shaderSource(o,s); gl.compileShader(o); if(!gl.getShaderParameter(o,gl.COMPILE_STATUS))log('shErr '+gl.getShaderInfoLog(o)); return o; }
const prog=gl.createProgram(); gl.attachShader(prog,sh(gl.VERTEX_SHADER,vs)); gl.attachShader(prog,sh(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS))log('linkErr '+gl.getProgramInfoLog(prog));
const uLoc=gl.getUniformLocation(prog,'t');
const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b); gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
const lp=gl.getAttribLocation(prog,'p'); gl.enableVertexAttribArray(lp); gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);

testRTT('RGBA16F', gl.RGBA16F, gl.HALF_FLOAT);
testRTT('RGBA32F', gl.RGBA32F, gl.FLOAT);
testRTT('R11F_G11F_B10F', gl.R11F_G11F_B10F, gl.HALF_FLOAT);
testRTT('RGBA8(대조군)', gl.RGBA8, gl.UNSIGNED_BYTE);
log('done');
</script></body></html>
