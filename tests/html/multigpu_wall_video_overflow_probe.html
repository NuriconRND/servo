<!doctype html>
<meta charset="utf-8">
<title>Multi-GPU Wall Video + Overflow Probe</title>
<!--
  DComp 투명 구멍 최소 재현 후보.

  multigpu_wall_video_minimal_probe.html과 **단 한 가지만 다르다**: body에 min-height를
  주어 문서가 뷰포트(1080)를 넘치게 한다. 비디오의 크기·위치·속성은 완전히 동일하다.

  관측 매트릭스:
    video_minimal_probe   (비디오 O, 넘침 X) -> 구멍 없음
    overflow_probe        (비디오 X, 넘침 O) -> 구멍 없음
    video_file_probe      (비디오 O, 넘침 O) -> 구멍 남   (단 페이지가 5760x3240이라 변수 다수)
    이 페이지             (비디오 O, 넘침 O, 그 외 최소) -> ?

  구멍이 나면 이게 최소 재현이다(HTML ~20줄). 안 나면 file_probe의 다른 속성
  (object-fit:cover / controls / 요소가 뷰포트 밖으로 나감 / 스테이지 테두리 등)이
  추가 조건이므로 하나씩 되살려 이분 탐색한다.
-->
<style>
  html, body { margin: 0; overflow: hidden; background: #111; color: #f4f4f4;
               font: 24px/1.3 ui-monospace, Consolas, monospace; }
  /* ★ 이것이 minimal_probe와의 유일한 차이 — 문서를 뷰포트보다 세로로 크게 만든다 */
  body { min-height: 2400px; }

  /* y=512는 WR 기본 픽처 타일 행 경계(1024x512). 구멍 상변이 여기 걸리는지 확인용 */
  .row512 { position: absolute; left: 0; top: 510px; width: 3840px; height: 4px;
            background: #2ed573; z-index: 2; }
  .seam   { position: absolute; left: 1918px; top: 0; width: 4px; height: 2400px;
            background: #ff4757; z-index: 2; }

  /* minimal_probe와 동일: 경계를 가로지르되 뷰포트 안에 완전히 들어가는 비디오 */
  video { position: absolute; left: 1520px; top: 240px; width: 800px; height: 450px;
          background: #000; }

  #stats { position: absolute; left: 48px; top: 48px; z-index: 3; white-space: pre; }
</style>
<div class="row512"></div>
<div class="seam"></div>
<div id="stats">loading</div>
<video id="v" autoplay muted loop playsinline>
  <source src="../Wildlife_FHD30fps_counter_10Mbitrate.mp4" type="video/mp4">
</video>
<script>
  const v = document.getElementById("v");
  const stats = document.getElementById("stats");
  let raf = 0;
  v.play().catch(() => {});
  function tick() {
    raf += 1;
    stats.textContent = [
      "video + overflow probe (DComp hole 최소 재현 후보)",
      `viewport: ${document.documentElement.clientWidth}x${document.documentElement.clientHeight}`,
      `document: ${document.documentElement.scrollWidth}x${document.documentElement.scrollHeight}`,
      `video box: left=1520 top=240 800x450 (seam x=1920 가로지름)`,
      `time: ${v.currentTime.toFixed(3)}  readyState: ${v.readyState}  raf: ${raf}`
    ].join("\n");
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
