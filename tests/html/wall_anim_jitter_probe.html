<!DOCTYPE html>
<meta charset="utf-8">
<title>애니메이션 끊김 판별</title>
<!--
  단순 등속 translateX 로 끊김의 층을 가른다. 같은 거리를 다른 시간에 가는 행들이고,
  ★가로 이음매(y=50vh=2160)를 축으로 위아래가 거울상이다★:

    위   B  = CSS @keyframes     1x     (엔진에 원래 있던 경로)
         C  = Element.animate()  1/4x
         D  = Element.animate()  1/16x
    가운데 A = Element.animate() 1x     ★네 GPU 영역을 모두 지난다★ (이음매에 걸쳐 있다)
    아래 D' = Element.animate()  1/16x
         C' = Element.animate()  1/4x
         B' = CSS @keyframes     1x

  ★왜 아래에도 두나 (2026-10-02)★ — 저더는 **패널별**이고 그 패널의 vblank 가 DWM 합성
  시점에서 어디에 있느냐가 정한다(설계 문서 §1). 즉 네 패널을 **동시에** 보고 어느 것이
  떠는지 가려야 하는데, 예전 배치는 B·C·D 가 위쪽 두 타일에만 있어서 아래 두 타일에는
  A 의 하반신 말고 볼 것이 없었다. 아래 패널이 떨어도 눈에 걸리지 않았다는 뜻이다.

  ★위아래 짝은 같은 방향·같은 위상으로 돈다.★ 반대로 돌리면 비교가 안 된다 -- 같은 x 에
  있어야 수직선 하나로 "위 타일과 아래 타일이 같은 프레임을 보여 주는가" 가 바로 읽힌다.
  WAAPI 쪽은 키프레임 offset 에, CSS 쪽은 `animation-delay` 에 위상을 박아 그것을 보장한다
  (★`startTime` 은 이 엔진에 없다★ -- `Animation` 은 `cancel()` 하나뿐이다).

  ★A 행이 왜 이음매에 걸쳐 있나★ — 벽은 2x2 다(가상 뷰포트 11520x4320, 5760x2160 타일
  넷). 상단에 쌓인 행은 **위쪽 두 타일만** 지난다. 표출 클럭을 DWM 합성 격자에 스냅한
  뒤 이 프로브가 10/10 으로 깨끗했는데(log_ani_debug/48), 그것은 2 영역 테스트였다 --
  output 페이지를 네 영역에 걸치자 저더가 돌아왔다(2026-09-21). 한 패스 안에서 타일
  넷이 순차로 커밋하므로 뒤쪽 타일일수록 DWM 주기의 늦은 자리에 떨어지는 것이 가설이고,
  그것을 재현하려면 한 객체가 네 영역을 다 지나야 한다.

  ★두 축으로 동시에 가른다.★

  1) A 와 B -- **경로**. 값 계산이 서로 완전히 다른 코드인데 똑같이 끊기면 애니메이션
     경로가 원인이 아니다. 한쪽만 끊기면 그 경로가 범인이다.

  2) A/C/D -- **속도**. 1x 는 초당 2,304px, 60Hz 에서 프레임당 38px 이다. 그만큼씩
     건너뛰는 선명한 텍스트는 엔진이 완벽해도 끊겨 보인다 -- 모션 블러가 없으니
     이산 점프가 그대로 보이고, output 페이지의 판 슬라이드처럼 큰 덩어리보다
     텍스트에서 훨씬 심하게 드러난다. D(프레임당 2.4px)가 매끄럽고 A 만 끊기면
     그것은 표본화 한계이지 결함이 아니다. 네 행이 똑같이 끊겨야 결함이다.

  각 행에 눈금자가 깔려 있다. 등속 운동이 눈금을 지나는 간격이 고르지 않으면 그것이
  끊김이고, 화면을 찍어 두면 나중에 프레임 단위로 되짚을 수 있다.

  ★아래 숫자로 매끄러움을 판정하지 말 것.★ 그것은 rAF, 즉 **스크립트 틱**의 주기다.
  이 애니메이션은 페인트측에 바인딩되므로 스크립트는 그 사이에 할 일이 없고,
  `gfx_paint_side_animation_tick_divisor`(기본 4)가 rAF 를 60Hz 의 1/4 = 66.7ms 로
  **의도적으로** 묶는다. 움직임 자체는 페인트 스레드가 매 합성마다 전진시킨다.

  이 페이지를 처음 만들 때 p50=66.7 을 빨간색 "매우 나쁨" 으로 표시했는데 그것이
  틀렸다(log_ani_debug/22). 같은 런에서 렌더러는 타일마다 60fps 를 냈고(WRRATE 최저
  59.8), 네 타일의 값은 0.4px 안에서 일치했다(log_ani_debug/24). 숫자는 정보로만 둔다.

  페이지 안에서는 합성된 결과를 볼 수 없으므로 매끄러움을 잴 방법이 없다. 판정은
  눈금자 위의 눈과 엔진 로그가 한다:

    * A 만 끊긴다                  -> WAAPI 경로
    * B 만 끊긴다                  -> CSS 애니메이션 경로
    * 둘 다 같은 모양으로 끊긴다   -> 애니메이션 경로가 아니다. 두 경로가 공유하는
                                     프레임 파이프라인, 그중에서도 값이 아니라 표시
                                     (present) 쪽을 봐야 한다 -- 값은 PAINTANIM 의
                                     (t_ms, x) 로, 프레임 수는 WRRATE 로 확인된다.
-->
<style>
  /* ★복제는 **위상**으로 흩는다.★ `--travel` 150vw 를 네 복제가 1/4 위상차로 돌므로 간격이
     37.5vw 이고, 100vw 짜리 행 안에 항상 두세 개가 보인다. 경로의 양 끝(`--x0` -25vw,
     `--x1` 125vw)이 화면 밖이라 ★한 바퀴의 점프가 보이지 않는 자리에서 일어난다★.
     예전에는 간격을 `left` 로 주고 넷이 같은 위상이었다. 위치는 이어졌지만 넷이 **동시에**
     랩을 돌아 그 한 프레임에 레이어 열둘이 각각 5,760px 움직였고, 그중 둘은 화면 안에서
     랩했다 -- 실기에서 1x 주기마다 "전체가 잠깐 멈췄다 다시 재생" 으로 보였다
     (log_ani_debug_03/17). 그 전에는 한 행에 객체 하나가 끝에서 되돌아 점프해 그 프레임의
     패스가 24ms 가 됐다(/16, 설계 문서 §37). ★둘 다 프로브가 스스로 만든 저더였다.★ */
  :root { --dur: 7.5s; --x0: -25vw; --x1: 125vw; --travel: 150vw; --rowh: 12.5vh; }
  html, body { margin: 0; background: #0b0b0b; color: #eee;
               font: 600 28px/1.4 "Consolas", monospace; overflow: hidden; }
  .row { position: absolute; left: 0; right: 0; height: var(--rowh);
         border-bottom: 1px solid #333; }
  .label { position: absolute; left: 8px; top: 4px; font-size: 20px; color: #7a7a7a; }
  /* 복제들이 사는 자리. 행을 꽉 채우고 아무것도 그리지 않는다. */
  .lane { position: absolute; left: 0; right: 0; top: 0; bottom: 0; }
  /* `left` 는 복제마다 JS 가 넣는다(-50, 0, 50, 100vw). 네 복제가 50vw 간격의 빗이고
     그 빗이 50vw 를 밀려 간 뒤 제자리로 돌아온다 -- 그래서 점프가 안 보인다. */
  .mover { position: absolute; top: 3vh; white-space: nowrap;
           font-size: 5vh; color: #4af; will-change: transform; }

  /* ★아래 절반에도 같은 행을 거울상으로 둔다.★
     저더는 **패널별**이고 그 패널의 vblank 위상이 정한다(설계 문서 §1). 그러니 네 패널
     전부에 움직이는 것이 있어야 눈으로 넷을 동시에 판정할 수 있다. 예전 배치는 B·C·D 가
     위쪽 두 타일에만 있어서 ★아래 두 타일은 A 의 하반신 말고는 비어 있었다★ -- 아래쪽
     패널이 떨고 있어도 볼 것이 없었다는 뜻이다.

     거울축은 가로 이음매 y=50vh(=2160) 다. 위 블록이 [0, 37.5] 이므로 아래는
     [62.5, 100] 이고, 각 행이 축에 대해 정확히 마주 본다.

     ★위아래 짝은 같은 방향·같은 위상으로 돈다★ -- 반대로 돌리면 비교가 안 된다. 같은
     x 에 있어야 수직선 하나로 "위 타일과 아래 타일이 같은 프레임을 보여 주는가" 가
     바로 읽힌다. 위상은 WAAPI 는 키프레임 offset, CSS 는 `animation-delay` 로 준다 --
     ★`startTime` 은 이 엔진에 없다★. */
  #rowB  { top: 0; }
  #rowC  { top: 12.5vh; }
  #rowD  { top: 25vh; }
  #rowD2 { top: 62.5vh; }
  #rowC2 { top: 75vh; }
  #rowB2 { top: 87.5vh; }

  /* ★A 행은 네 GPU 영역을 모두 지난다.★
     레이아웃은 2x2 다 -- 가상 뷰포트 11520x4320 에 5760x2160 타일 넷
     (`wall_layout.multigpu.json`). 그래서 상단에 쌓인 행은 **위쪽 두 타일만** 지난다.
     격자 스냅 검증에서 10/10 이 나온 것이 바로 그 2 영역 테스트였고, output 페이지가
     네 영역에 걸치자 저더가 돌아왔다(2026-09-21 실기 보고).

     세로 이음매는 y=2160 = 50vh 다. A 행을 거기에 **걸치게** 두면 한 객체가 위/아래
     타일을 동시에 지나고, 가로로 80vw(9216px) 이동하면 x=5760 이음매도 넘는다 --
     즉 이동 중에 네 영역을 모두 통과한다. */
  .seam { position: absolute; left: 0; right: 0; top: 50vh;
          transform: translateY(-50%); height: 14vh; }
  /* 이음매 자체를 그려 둔다. 눈이 "지금 어느 타일에 있나" 를 판단할 기준선이다. */
  .seam-guide { position: absolute; left: 0; right: 0; top: 50vh; height: 2px;
                background: #533; }
  .seam-guide.vertical { left: 50vw; right: auto; top: 0; bottom: 0;
                         width: 2px; height: auto; }
  /* ★CSS 와 WAAPI 가 같은 움직임을 해야 한다.★ 이 엔진의 `Element.animate` 는
     `iterations`·`easing`·`duration`·`fill` 네 개만 읽고(`element.rs` 의 `fn Animate`)
     `Animation` 인터페이스는 `cancel()` 하나뿐이다(`Animation.webidl`) -- `direction`,
     `delay`, `startTime` 이 전부 없다. 그래서 WAAPI 쪽 위상은 키프레임 offset 에 박고,
     CSS 쪽은 `animation-delay` 로 같은 위상을 만든다. 수단은 달라도 ★움직임은 같다★.
     경로의 양 끝이 화면 밖이라 한 바퀴의 점프가 보이지 않는다. */
  .mover.css { color: #fa4; animation: slide var(--dur) linear infinite; }
  @keyframes slide { from { transform: translateX(var(--x0)); }
                     to   { transform: translateX(var(--x1)); } }
  /* 눈금자: 등속이면 눈금 통과 간격이 일정해야 한다. */
  .ruler { position: absolute; top: 0; left: 0; right: 0; height: 100%;
           background: repeating-linear-gradient(to right,
             #222 0, #222 2px, transparent 2px, transparent calc(var(--travel) / 15)); }
  /* 위 블록(…37.5vh)과 A 행(43vh…) 사이의 빈 띠에 둔다. 아래 절반이 거울상으로 차므로
     흐름 배치로는 놓을 자리가 없다. */
  #stats { position: absolute; left: 8px; top: 38vh; margin: 0;
           font-size: 0.65vh; line-height: 1.3; white-space: pre; color: #ddd; }
  .warn { color: #f66; }
  .ok { color: #6d6; }
</style>

<!-- 이음매 기준선. 가로 = y 2160(위/아래 타일 경계), 세로 = x 5760(좌/우 경계). -->
<div class="seam-guide"></div>
<div class="seam-guide vertical"></div>

<!-- ★A: 네 GPU 영역을 모두 지나는 1x 객체.★ 가로 이음매에 걸쳐 있으므로 한 글자가
     위/아래 타일에 동시에 걸리고, 80vw 를 이동하며 세로 이음매도 넘는다. 이것이
     output 페이지에서 저더가 돌아온 조건(네 영역)과 같은 조건이다. -->
<div class="seam">
  <div class="ruler"></div>
  <div class="label">A · WAAPI · 1x · ★네 GPU 영역 통과★ (프레임당 약 38px)</div>
  <div class="lane" id="waapiMover"></div>
</div>

<div class="row" id="rowB"><div class="ruler"></div>
  <div class="label">B · CSS @keyframes · 1x · 위</div>
  <div class="lane" id="cssMover"></div>
</div>
<!--
  ★속도를 나눠 같이 돌린다.★ 1x 는 초당 2,304px, 60Hz 에서 프레임당 38px 이다.
  그만큼씩 건너뛰는 선명한 텍스트는 엔진이 완벽해도 끊겨 보인다 -- 모션 블러가
  없으니 이산 점프가 그대로 보인다. 느린 행이 매끄럽고 빠른 행만 끊기면 그것은
  속도에 따른 표본화 한계이지 결함이 아니다. 네 행이 똑같이 끊기면 그때가 결함이다.
-->
<div class="row" id="rowC"><div class="ruler"></div>
  <div class="label">C · WAAPI · 1/4x (프레임당 약 9.6px) · 위</div>
  <div class="lane" id="quarterMover"></div>
</div>
<div class="row" id="rowD"><div class="ruler"></div>
  <div class="label">D · WAAPI · 1/16x (프레임당 약 2.4px) · 위</div>
  <div class="lane" id="slowMover"></div>
</div>

<!-- ★아래 두 타일용 거울상.★ 가로 이음매(50vh)에 대해 위 블록과 마주 본다. 같은 속도의
     위아래 짝이 **같은 x** 에 있어야 하므로 방향도 위상도 같게 돌린다 -- 수직선 하나로
     "위 타일과 아래 타일이 같은 프레임인가" 가 읽힌다. 위에서부터 D'·C'·B' 순서인 것은
     거울이기 때문이다(위가 B·C·D 이므로 아래는 뒤집힌 순서라야 축에 대해 대칭이다). -->
<div class="row" id="rowD2"><div class="ruler"></div>
  <div class="label">D' · WAAPI · 1/16x · 아래</div>
  <div class="lane" id="slowMover2"></div>
</div>
<div class="row" id="rowC2"><div class="ruler"></div>
  <div class="label">C' · WAAPI · 1/4x · 아래</div>
  <div class="lane" id="quarterMover2"></div>
</div>
<div class="row" id="rowB2"><div class="ruler"></div>
  <div class="label">B' · CSS @keyframes · 1x · 아래</div>
  <div class="lane" id="cssMover2"></div>
</div>

<div id="stats">측정 준비 중...</div>

<script>
'use strict';

/* ★복제를 **위상**으로 흩는다.★ `--travel` 150vw 를 네 복제가 1/4 위상차로 돌므로 간격이
   37.5vw 이고, 100vw 짜리 행 안에 항상 두세 개(부분 표출까지 넷)가 보인다. 경로의 양 끝이
   화면 밖(-25vw / 125vw)이라 ★한 바퀴의 점프가 보이지 않는 자리에서 일어난다★.

   위상은 ★양쪽 다 `delay`(음수)로 준다★. CSS 는 `animation-delay`, WAAPI 는 `animate()` 의
   `delay` 옵션이고 ★같은 계산을 거친다★ -- stylo 의 `started_at = now + delay` 와 음수 delay
   반복 전진 루프가 한 곳이다(`servo/animation.rs`). 그래서 두 경로가 글자 그대로 같이 움직인다.

   ★그 `delay` 는 이 엔진에 없었다.★ `Element.animate` 가 `iterations`·`easing`·`duration`·
   `fill` 네 개만 읽었고 `direction`/`delay` 는 사전에 선언되어 있지도 않아 WebIDL 이 조용히
   버렸다. 그래서 두 차례 우회를 시도했고 둘 다 더 나빴다:
     1. `direction: 'alternate'` -- WAAPI 에서 무시되어 CSS 만 왕복, 두 경로가 갈렸다.
     2. 키프레임 안에 불연속(offset w -> w+1e-6)을 박아 위상을 만들었다 -- CSS 쪽에는 없는
        잔상이 WAAPI 객체마다 생겼다(log_ani_debug_03/18). 큰 transform 점프가 떠난 자리의
        picture cache 를 무효화하지 않는 것으로 보이고, Edge/Chrome 에서는 나지 않는다.
   그래서 엔진에 `delay` 와 `direction` 을 넣었다. 이제 우회가 필요 없다. */
const COPIES = 4;
/** 전체 이동 거리(vw). 양 끝이 화면 밖이어야 랩이 안 보인다. */
const TRAVEL_VW = 150;
/** 경로 시작(vw). 글자가 가장 긴 행이 약 19vw 이므로 25vw 면 완전히 가려진다. */
const X0_VW = -25;
/** 1x 가 150vw 를 가는 시간. 2,304px/s = 20vw/s 를 유지한다. CSS `--dur` 과 같아야 한다. */
const DURATION_MS = 7500;

const travelPx = () => window.innerWidth * (TRAVEL_VW / 100);
const x0Px = () => window.innerWidth * (X0_VW / 100);
/** 복제 `i` 의 위상 = 음수 delay(ms). CSS 와 WAAPI 가 같은 값을 쓴다. */
const delayMs = (i, durationMs) => -Math.round((durationMs * i) / COPIES);

/** 레인 하나를 복제로 채운다. `useCss` 면 CSS 애니메이션 + 음수 delay. */
function fillLane(laneId, text, useCss, durationMs) {
  const lane = document.getElementById(laneId);
  while (lane.firstChild) lane.removeChild(lane.firstChild);
  const made = [];
  for (let i = 0; i < COPIES; i++) {
    const el = document.createElement('div');
    el.className = useCss ? 'mover css' : 'mover';
    el.textContent = text;
    if (useCss) el.style.animationDelay = delayMs(i, durationMs) + 'ms';
    lane.appendChild(el);
    made.push(el);
  }
  return made;
}

// --- 행 정의. 속도만 다르고 나머지는 같다. ---
// 같은 거리를 4배/16배 긴 시간에 가므로 프레임당 이동 픽셀이 1/4, 1/16 이 된다.
const CSS_ROWS = [
  ['cssMover', '████ CSS 1x ████'],
  ['cssMover2', '████ CSS 1x ████'],
];
const WAAPI_ROWS = [
  ['waapiMover', '████ WAAPI 1x ████', DURATION_MS],
  ['quarterMover', '████ 1/4x ████', DURATION_MS * 4],
  ['slowMover', '████ 1/16x ████', DURATION_MS * 16],
  ['quarterMover2', '████ 1/4x ████', DURATION_MS * 4],
  ['slowMover2', '████ 1/16x ████', DURATION_MS * 16],
];

for (const row of CSS_ROWS) fillLane(row[0], row[1], true, DURATION_MS);

const hasWaapi = typeof document.createElement('div').animate === 'function';
const handles = [];

function startWaapiRows() {
  while (handles.length) handles.pop().cancel();
  const frames = [
    { transform: 'translateX(' + Math.round(x0Px()) + 'px)' },
    { transform: 'translateX(' + Math.round(x0Px() + travelPx()) + 'px)' },
  ];
  for (const row of WAAPI_ROWS) {
    const copies = fillLane(row[0], row[1], false, row[2]);
    for (let i = 0; i < copies.length; i++) {
      // ★CSS 와 같은 옵션을 쓴다.★ 키프레임은 단조다 -- 불연속이 없으므로 잔상도 없다.
      handles.push(
        copies[i].animate(frames, {
          duration: row[2],
          delay: delayMs(i, row[2]),
          iterations: Infinity,
          easing: 'linear',
        })
      );
    }
  }
}

if (hasWaapi) {
  startWaapiRows();
} else {
  for (const row of WAAPI_ROWS) {
    document.getElementById(row[0]).textContent =
      'Element.animate 없음 (dom_web_animations_enabled=false)';
  }
}

// --- rAF 간격 분포. 평균이 아니라 꼬리를 본다. ---
const intervals = [];
let last = null;
let reported = 0;

function pct(sorted, p) {
  if (!sorted.length) return 0;
  const i = Math.min(sorted.length - 1, Math.floor(sorted.length * p));
  return sorted[i];
}

function tick(now) {
  if (last !== null) intervals.push(now - last);
  last = now;

  // 1초마다 분포를 낸다. 창을 비우지 않고 누적해서, 긴 런의 꼬리가 남게 한다.
  if (intervals.length && now - reported >= 1000) {
    reported = now;
    const s = intervals.slice().sort((a, b) => a - b);
    const over20 = intervals.filter((d) => d > 20).length;
    const over33 = intervals.filter((d) => d > 33).length;
    // ★이 숫자로 매끄러움을 판정하지 말 것.★
    //
    // 처음에는 여기서 ">20ms 가 2% 넘으면 빨강" 으로 판정했는데, 그것이 틀렸다.
    // 이 애니메이션은 페인트측에 바인딩되어(PAINTANIM tx_bound) 페인트 스레드가
    // 매 합성마다 값을 전진시킨다. 스크립트는 그 사이에 할 일이 없으므로
    // `gfx_paint_side_animation_tick_divisor`(기본 4)가 rAF 를 60Hz 의 1/4,
    // 즉 66.7ms 로 **의도적으로** 묶는다. 실측(log_ani_debug/22)에서 p50=66.7 로
    // 찍혔고 그것은 정상이다 -- 같은 런에서 렌더러는 타일마다 60fps 를 냈고
    // (WRRATE 최저 59.8), 네 타일의 값은 0.4px 안에서 일치했다(log_ani_debug/24).
    //
    // 페이지 안에서는 합성된 결과를 볼 수 없으므로 움직임의 매끄러움을 잴 방법이
    // 없다. 그래서 숫자는 정보로만 두고 판정하지 않는다. 판정은 눈금자 위의 눈과
    // 엔진 로그(PAINTANIM t_ms / WRRATE)가 한다.
    const line =
      '스크립트 틱 주기(rAF, ms)  p50=' + pct(s, 0.50).toFixed(1) +
      '  p95=' + pct(s, 0.95).toFixed(1) +
      '  p99=' + pct(s, 0.99).toFixed(1) +
      '  max=' + s[s.length - 1].toFixed(1) +
      '\n표본 ' + intervals.length + ' · >20ms ' + over20 + ' · >33ms ' + over33 +
      '\n※ p50≈66.7 은 정상이다 — tick_divisor=4 가 rAF 를 60Hz/4 로 묶은 값이고,' +
      '\n   움직임 자체는 페인트측이 매 합성마다 전진시킨다. 이 숫자는 매끄러움의' +
      '\n   지표가 아니다. 끊김은 눈금자를 보고 판정하라.' +
      '\nWAAPI ' + (hasWaapi ? 'ON' : 'OFF') + ' · 복제 ' + COPIES + '개 · 이동폭 ' + Math.round(travelPx()) + 'px / ' + DURATION_MS + 'ms';

    const el = document.getElementById('stats');
    el.textContent = line;

    // 로그 파일로도 내보낸다 -- 화면을 못 볼 때 이 줄만 grep 하면 된다.
    console.log('ANIMJITTER p50=' + pct(s, 0.50).toFixed(1) +
                ' p95=' + pct(s, 0.95).toFixed(1) +
                ' p99=' + pct(s, 0.99).toFixed(1) +
                ' max=' + s[s.length - 1].toFixed(1) +
                ' frames=' + intervals.length +
                ' over20=' + over20 + ' over33=' + over33 +
                ' waapi=' + (hasWaapi ? 1 : 0));
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// 창 크기가 바뀌면 이동폭이 달라지므로 WAAPI 쪽을 다시 건다.
// (CSS 쪽은 vw 단위라 알아서 따라간다.)
let resizeTimer = null;
window.addEventListener('resize', () => {
  if (!hasWaapi) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(startWaapiRows, 200);
});
</script>
