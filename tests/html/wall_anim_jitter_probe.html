<!DOCTYPE html>
<meta charset="utf-8">
<title>애니메이션 끊김 판별</title>
<!--
  단순 등속 translateX 로 끊김의 층을 가른다. 네 행이 같은 거리를 다른 시간에 간다:

    A = Element.animate()  1x     (WAAPI, dom_web_animations_enabled 필요)
    B = CSS @keyframes     1x     (엔진에 원래 있던 경로)
    C = Element.animate()  1/4x
    D = Element.animate()  1/16x

  ★두 축으로 동시에 가른다.★

  1) A 와 B -- **경로**. 값 계산이 서로 완전히 다른 코드인데 똑같이 끊기면 애니메이션
     경로가 원인이 아니다. 한쪽만 끊기면 그 경로가 범인이다.

  2) A/C/D -- **속도**. 1x 는 초당 2,304px, 60Hz 에서 프레임당 38px 이다. 그만큼씩
     건너뛰는 선명한 텍스트는 엔진이 완벽해도 끊겨 보인다 -- 모션 블러가 없으니
     이산 점프가 그대로 보이고, output 페이지의 판 슬라이드처럼 큰 덩어리보다
     텍스트에서 훨씬 심하게 드러난다. D(프레임당 2.4px)가 매끄럽고 A 만 끊기면
     그것은 표본화 한계이지 결함이 아니다. 네 행이 똑같이 끊겨야 결함이다.

  각 행에 눈금자가 깔려 있다. 등속 운동이 눈금을 지나는 간격이 고르지 않으면 그것이
  끊김이고, 화면을 찍어 두면 나중에 프레임 단위로 되짚을 수 있다.

  ★아래 숫자로 매끄러움을 판정하지 말 것.★ 그것은 rAF, 즉 **스크립트 틱**의 주기다.
  이 애니메이션은 페인트측에 바인딩되므로 스크립트는 그 사이에 할 일이 없고,
  `gfx_paint_side_animation_tick_divisor`(기본 4)가 rAF 를 60Hz 의 1/4 = 66.7ms 로
  **의도적으로** 묶는다. 움직임 자체는 페인트 스레드가 매 합성마다 전진시킨다.

  이 페이지를 처음 만들 때 p50=66.7 을 빨간색 "매우 나쁨" 으로 표시했는데 그것이
  틀렸다(log_ani_debug/22). 같은 런에서 렌더러는 타일마다 60fps 를 냈고(WRRATE 최저
  59.8), 네 타일의 값은 0.4px 안에서 일치했다(log_ani_debug/24). 숫자는 정보로만 둔다.

  페이지 안에서는 합성된 결과를 볼 수 없으므로 매끄러움을 잴 방법이 없다. 판정은
  눈금자 위의 눈과 엔진 로그가 한다:

    * A 만 끊긴다                  -> WAAPI 경로
    * B 만 끊긴다                  -> CSS 애니메이션 경로
    * 둘 다 같은 모양으로 끊긴다   -> 애니메이션 경로가 아니다. 두 경로가 공유하는
                                     프레임 파이프라인, 그중에서도 값이 아니라 표시
                                     (present) 쪽을 봐야 한다 -- 값은 PAINTANIM 의
                                     (t_ms, x) 로, 프레임 수는 WRRATE 로 확인된다.
-->
<style>
  :root { --dur: 4s; --travel: 80vw; }
  html, body { margin: 0; background: #0b0b0b; color: #eee;
               font: 600 28px/1.4 "Consolas", monospace; overflow: hidden; }
  .row { position: relative; height: 15vh; border-bottom: 1px solid #333; }
  .label { position: absolute; left: 8px; top: 4px; font-size: 20px; color: #7a7a7a; }
  .mover { position: absolute; top: 4vh; left: 0; white-space: nowrap;
           font-size: 6vh; color: #4af; will-change: transform; }
  #cssMover { color: #fa4; animation: slide var(--dur) linear infinite; }
  @keyframes slide { from { transform: translateX(0); }
                     to   { transform: translateX(var(--travel)); } }
  /* 눈금자: 등속이면 눈금 통과 간격이 일정해야 한다. */
  .ruler { position: absolute; top: 0; left: 0; right: 0; height: 100%;
           background: repeating-linear-gradient(to right,
             #222 0, #222 2px, transparent 2px, transparent calc(var(--travel) / 16)); }
  #stats { padding: 12px 16px; font-size: 26px; white-space: pre; color: #ddd; }
  .warn { color: #f66; }
  .ok { color: #6d6; }
</style>

<div class="row"><div class="ruler"></div>
  <div class="label">A · WAAPI · 1x (프레임당 약 38px)</div>
  <div class="mover" id="waapiMover">████ WAAPI 1x ████</div>
</div>
<div class="row"><div class="ruler"></div>
  <div class="label">B · CSS @keyframes · 1x</div>
  <div class="mover" id="cssMover">████ &nbsp;CSS 1x&nbsp; ████</div>
</div>
<!--
  ★속도를 나눠 같이 돌린다.★ 1x 는 초당 2,304px, 60Hz 에서 프레임당 38px 이다.
  그만큼씩 건너뛰는 선명한 텍스트는 엔진이 완벽해도 끊겨 보인다 -- 모션 블러가
  없으니 이산 점프가 그대로 보인다. 느린 행이 매끄럽고 빠른 행만 끊기면 그것은
  속도에 따른 표본화 한계이지 결함이 아니다. 네 행이 똑같이 끊기면 그때가 결함이다.
-->
<div class="row"><div class="ruler"></div>
  <div class="label">C · WAAPI · 1/4x (프레임당 약 9.6px)</div>
  <div class="mover" id="quarterMover">████ 1/4x ████</div>
</div>
<div class="row"><div class="ruler"></div>
  <div class="label">D · WAAPI · 1/16x (프레임당 약 2.4px)</div>
  <div class="mover" id="slowMover">████ 1/16x ████</div>
</div>
<div id="stats">측정 준비 중...</div>

<script>
'use strict';

const DURATION_MS = 4000;
const travelPx = () => Math.round(window.innerWidth * 0.80);

// --- WAAPI 행들. 속도만 다르고 나머지는 같다. ---
// 같은 거리를 4배/16배 긴 시간에 가므로, 프레임당 이동 픽셀이 1/4, 1/16 이 된다.
const waapi = document.getElementById('waapiMover');
const hasWaapi = typeof waapi.animate === 'function';
const handles = [];

function runWaapi(el, durationMs) {
  return el.animate(
    [{ transform: 'translateX(0px)' }, { transform: 'translateX(' + travelPx() + 'px)' }],
    { duration: durationMs, iterations: Infinity, easing: 'linear' }
  );
}

const waapiRows = [
  ['waapiMover', DURATION_MS],
  ['quarterMover', DURATION_MS * 4],
  ['slowMover', DURATION_MS * 16],
];

function startWaapiRows() {
  while (handles.length) handles.pop().cancel();
  for (const [id, duration] of waapiRows) {
    handles.push(runWaapi(document.getElementById(id), duration));
  }
}

if (hasWaapi) {
  startWaapiRows();
} else {
  for (const [id] of waapiRows) {
    document.getElementById(id).textContent =
      'Element.animate 없음 (dom_web_animations_enabled=false)';
  }
}

// --- rAF 간격 분포. 평균이 아니라 꼬리를 본다. ---
const intervals = [];
let last = null;
let reported = 0;

function pct(sorted, p) {
  if (!sorted.length) return 0;
  const i = Math.min(sorted.length - 1, Math.floor(sorted.length * p));
  return sorted[i];
}

function tick(now) {
  if (last !== null) intervals.push(now - last);
  last = now;

  // 1초마다 분포를 낸다. 창을 비우지 않고 누적해서, 긴 런의 꼬리가 남게 한다.
  if (intervals.length && now - reported >= 1000) {
    reported = now;
    const s = intervals.slice().sort((a, b) => a - b);
    const over20 = intervals.filter((d) => d > 20).length;
    const over33 = intervals.filter((d) => d > 33).length;
    // ★이 숫자로 매끄러움을 판정하지 말 것.★
    //
    // 처음에는 여기서 ">20ms 가 2% 넘으면 빨강" 으로 판정했는데, 그것이 틀렸다.
    // 이 애니메이션은 페인트측에 바인딩되어(PAINTANIM tx_bound) 페인트 스레드가
    // 매 합성마다 값을 전진시킨다. 스크립트는 그 사이에 할 일이 없으므로
    // `gfx_paint_side_animation_tick_divisor`(기본 4)가 rAF 를 60Hz 의 1/4,
    // 즉 66.7ms 로 **의도적으로** 묶는다. 실측(log_ani_debug/22)에서 p50=66.7 로
    // 찍혔고 그것은 정상이다 -- 같은 런에서 렌더러는 타일마다 60fps 를 냈고
    // (WRRATE 최저 59.8), 네 타일의 값은 0.4px 안에서 일치했다(log_ani_debug/24).
    //
    // 페이지 안에서는 합성된 결과를 볼 수 없으므로 움직임의 매끄러움을 잴 방법이
    // 없다. 그래서 숫자는 정보로만 두고 판정하지 않는다. 판정은 눈금자 위의 눈과
    // 엔진 로그(PAINTANIM t_ms / WRRATE)가 한다.
    const line =
      '스크립트 틱 주기(rAF, ms)  p50=' + pct(s, 0.50).toFixed(1) +
      '  p95=' + pct(s, 0.95).toFixed(1) +
      '  p99=' + pct(s, 0.99).toFixed(1) +
      '  max=' + s[s.length - 1].toFixed(1) +
      '\n표본 ' + intervals.length + ' · >20ms ' + over20 + ' · >33ms ' + over33 +
      '\n※ p50≈66.7 은 정상이다 — tick_divisor=4 가 rAF 를 60Hz/4 로 묶은 값이고,' +
      '\n   움직임 자체는 페인트측이 매 합성마다 전진시킨다. 이 숫자는 매끄러움의' +
      '\n   지표가 아니다. 끊김은 눈금자를 보고 판정하라.' +
      '\nWAAPI ' + (hasWaapi ? 'ON' : 'OFF') + ' · 이동폭 ' + travelPx() + 'px / ' + DURATION_MS + 'ms';

    const el = document.getElementById('stats');
    el.textContent = line;

    // 로그 파일로도 내보낸다 -- 화면을 못 볼 때 이 줄만 grep 하면 된다.
    console.log('ANIMJITTER p50=' + pct(s, 0.50).toFixed(1) +
                ' p95=' + pct(s, 0.95).toFixed(1) +
                ' p99=' + pct(s, 0.99).toFixed(1) +
                ' max=' + s[s.length - 1].toFixed(1) +
                ' frames=' + intervals.length +
                ' over20=' + over20 + ' over33=' + over33 +
                ' waapi=' + (hasWaapi ? 1 : 0));
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// 창 크기가 바뀌면 이동폭이 달라지므로 WAAPI 쪽을 다시 건다.
// (CSS 쪽은 vw 단위라 알아서 따라간다.)
let resizeTimer = null;
window.addEventListener('resize', () => {
  if (!hasWaapi) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(startWaapiRows, 200);
});
</script>
