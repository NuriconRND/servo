<!DOCTYPE html>
<!--
  STANDARD <video> extended-dispatch probe (no <x-media>/<rtsp-stream>).

  Same markup a normal-browser author would write: plain <video> with typed
  <source> children and inline fallback content. It branches by ENVIRONMENT:
    - Standard browser: the non-standard container / rtsp source is rejected
      (canPlayType=="" ) -> all sources fail -> the element's inline fallback
      content (the descriptive <p>) is shown and MediaError is
      MEDIA_ERR_SRC_NOT_SUPPORTED (graceful degradation).
    - Multi-GPU wall browser:
        --pref dom_video_extended_containers_enabled=true accepts the typed
          <source> for mkv/avi/wmv/ts/flv/mov and plays it via the normal
          GStreamer pipeline (playbin3 auto-demux).
        --pref dom_video_network_uri_enabled=true routes a <video src="rtsp://…">
          to a GStreamer NetworkUri player (rtspsrc), no AppSrc fetch.

  Reuses the assets generated for the <x-media> probe at servo/test_media/
  (see multigpu_x_media_containers_probe.html for the ffmpeg recipe).
  For the rtsp case start a local server first, e.g.:
    gst-validate-rtsp-server-1.0 file:///F:/…/servo/test_media/test_media.mov
    (serves rtsp://127.0.0.1:8554/test)

  Run:
    target\debug\servoshell.exe ^
      --pref dom_video_extended_containers_enabled=true ^
      --pref dom_video_network_uri_enabled=true ^
      tests\html\multigpu_standard_video_extended_probe.html
    # Omit the prefs to observe the standard-browser fallback behavior.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>standard &lt;video&gt; extended dispatch probe</title>
  <style>
    html, body { margin:0; background:#0b0d12; color:#e8e8f0; font-family:system-ui,sans-serif; }
    h1 { font-size:28px; margin:14px 18px; }
    p.lead { margin:0 18px 14px; color:#9aa; font-size:15px; }
    .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:18px; padding:0 18px 18px; }
    .cell { background:#14161d; border-radius:10px; padding:12px; }
    .cell h2 { font-size:22px; margin:0 0 8px; color:#6cb4f0; }
    video { display:block; width:100%; height:200px; background:#000; border:2px solid #6cb4f0; border-radius:6px; }
    .fallback { color:#ffcf99; background:#1c1410; border:2px dashed #ff9f43; border-radius:6px; padding:10px; font-size:14px; }
    .status { font-family:monospace; font-size:13px; color:#bcf; margin-top:8px; white-space:pre-wrap; }
    .bad { color:#ff9f43; }
  </style>
</head>
<body>
  <h1>standard &lt;video&gt; — extended containers + rtsp</h1>
  <p class="lead">Standard browser: unsupported sources show the orange inline fallback.
     Wall browser (prefs on): the same &lt;video&gt; plays.</p>
  <div class="grid" id="grid"></div>
  <script>
    const BASE = "file:///F:/20260609_SDWall_BrowserTest/20260606_multigpu_browser/servo/test_media/test_media.";
    // label, src, MIME type for the typed <source>.
    const containers = [
      { ext: "mkv", type: "video/x-matroska" },
      { ext: "avi", type: "video/x-msvideo" },
      { ext: "wmv", type: "video/x-ms-wmv" },
      { ext: "ts",  type: "video/mp2t" },
      { ext: "flv", type: "video/x-flv" },
      { ext: "mov", type: "video/quicktime" },
    ];
    const grid = document.getElementById("grid");
    const items = [];

    function makeCell(title, build) {
      const cell = document.createElement("div");
      cell.className = "cell";
      const h = document.createElement("h2"); h.textContent = title;
      cell.appendChild(h);
      const { node, status } = build();
      cell.appendChild(node);
      const st = document.createElement("div"); st.className = "status"; st.textContent = "loading";
      cell.appendChild(st);
      grid.appendChild(cell);
      return { st, status };
    }

    for (const c of containers) {
      const probe = document.createElement("video");
      const cpt = probe.canPlayType(c.type);
      const cell = makeCell("." + c.ext, () => {
        const v = document.createElement("video");
        v.muted = true; v.autoplay = true; v.loop = true; v.setAttribute("playsinline", "");
        const s = document.createElement("source");
        s.src = BASE + c.ext; s.type = c.type;
        v.appendChild(s);
        const fb = document.createElement("p");
        fb.className = "fallback";
        fb.textContent = `Cannot play ${c.ext.toUpperCase()} (${c.type}) in this browser.`;
        v.appendChild(fb);
        v.addEventListener("loadedmetadata", () => v.play().catch(() => {}));
        return { node: v, status: () => v };
      });
      items.push({ key: c.ext, type: c.type, canPlay: cpt, ...cell });
    }

    // rtsp:// via a bare <video src> + inline fallback.
    {
      const cell = makeCell("rtsp://", () => {
        const v = document.createElement("video");
        v.muted = true; v.autoplay = true; v.setAttribute("playsinline", "");
        v.src = "rtsp://127.0.0.1:8554/test";
        const fb = document.createElement("p");
        fb.className = "fallback";
        fb.textContent = "Cannot play rtsp:// live stream in this browser.";
        v.appendChild(fb);
        v.addEventListener("loadedmetadata", () => v.play().catch(() => {}));
        return { node: v, status: () => v };
      });
      const probe = document.createElement("video");
      items.push({ key: "rtsp", type: "rtsp://", canPlay: "(scheme)", ...cell });
    }

    let t = 0;
    setInterval(() => {
      t++;
      for (const it of items) {
        const v = it.status();
        const err = v.error ? `err=${v.error.code}` : "err=none";
        const playing = v.readyState >= 2 && !v.paused && !v.ended;
        it.st.textContent =
          `canPlayType=${JSON.stringify(it.canPlay)}\n` +
          `readyState=${v.readyState} ${err}\n` +
          `size=${v.videoWidth}x${v.videoHeight} ` + (playing ? "▶ playing" : "■ stopped");
        it.st.className = playing ? "status" : "status bad";
        if (t % 3 === 0) {
          console.error(`STD_VIDEO ${it.key}: canPlay=${JSON.stringify(it.canPlay)} ` +
            `readyState=${v.readyState} ${err} ${v.videoWidth}x${v.videoHeight} playing=${playing}`);
        }
      }
    }, 1500);

    // Headless verification helper: ?autoclose=MS exits cleanly so stderr flushes.
    const _ac = new URLSearchParams(location.search).get("autoclose");
    if (_ac) setTimeout(() => window.close(), parseInt(_ac, 10) || 8000);
  </script>
</body>
</html>
