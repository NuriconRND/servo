<!doctype html>
<meta charset="utf-8">
<title>multigpu wall ruler probe</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #101014; }
  /* 8px 미세 눈금 + 120px 주눈금. 8과 120은 1920/1080 둘 다 나누므로 어떤 타일
     경계든 항상 주눈금선 위에 온다. 가드밴드 32px = 미세 정확히 4칸이라 한 칸만
     어긋나도 즉시 보인다. */
  #ruler {
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(to right,  #26263a 0 1px, transparent 1px 8px),
      repeating-linear-gradient(to bottom, #26263a 0 1px, transparent 1px 8px),
      repeating-linear-gradient(to right,  #5a5ab4 0 1px, transparent 1px 120px),
      repeating-linear-gradient(to bottom, #5a5ab4 0 1px, transparent 1px 120px);
  }
  .lbl {
    position: absolute; font: 11px/1 monospace; color: #7fb2d9;
    white-space: nowrap; pointer-events: none;
  }
  /* 훑어보기용 리듬일 뿐 판정에는 쓰이지 않는다 — 판정은 타일 구석 라벨을 직접 읽는다. */
  .lbl.major { color: #ffd75f; font-weight: bold; }
</style>
<div id="ruler"></div>
<script>
  // 가상 뷰포트 전체에 절대 좌표 라벨을 깐다. 라벨이 모든 타일에 나타나야 하므로
  // 한 축 가장자리가 아니라 격자 교차점마다 찍는다.
  //
  // STEP=120 = gcd(1920, 1080). 이 값이어야 1920/1080/2160/3840을 전부 나누어
  // **모든 타일 원점에 라벨이 정확히 놓인다** — 판정 규칙("타일 창 좌상단 구석의
  // 라벨이 그 타일 rect 원점과 일치")이 성립하는 전제다. 128을 쓰면 1080 % 128 = 56
  // 이라 세로 분할 layout의 경계 y=1080에 라벨이 없어 구석을 직접 읽을 수 없다.
  const STEP = 120, MAJOR = 600;
  const w = document.documentElement.clientWidth;
  const h = document.documentElement.clientHeight;
  let html = '';
  for (let y = 0; y < h; y += STEP) {
    for (let x = 0; x < w; x += STEP) {
      const major = (x % MAJOR === 0) && (y % MAJOR === 0);
      html += `<span class="lbl${major ? ' major' : ''}" style="left:${x + 3}px;top:${y + 3}px">${x},${y}</span>`;
    }
  }
  document.getElementById('ruler').insertAdjacentHTML('beforeend', html);
  document.title = `ruler ${w}x${h}`;
</script>
