<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Complex Animation Stress</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0; width: 100%; height: 100%; overflow: hidden;
    background: #101018;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    color: #f4f4f4;
  }
  #stage { position: fixed; inset: 0; }
  /* 각 박스: 그라디언트 배경 + 그림자, CSS keyframes 로 이동/회전/스케일 (JS 없이 스타일 애니메이션) */
  .box {
    position: absolute;
    width: 46px; height: 46px;
    border-radius: 8px;
    box-shadow: 0 2px 6px rgba(0,0,0,.5);
    will-change: transform;
    animation-name: drift;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    animation-direction: alternate;
  }
  @keyframes drift {
    from { transform: translate(0,0) rotate(0deg) scale(1); }
    to   { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(var(--sc)); }
  }
  #stats {
    position: fixed; left: 16px; top: 16px; z-index: 10;
    padding: 12px 16px; background: rgba(0,0,0,.78);
    border: 1px solid rgba(255,255,255,.34);
    font-size: 20px; line-height: 1.4; white-space: pre; pointer-events: none;
  }
</style>
</head>
<body>
<div id="stage"></div>
<div id="stats">loading…</div>
<script>
  "use strict";
  const params = new URLSearchParams(location.search);
  // ?n= 요소 개수 (기본 2000). ?js=1 이면 CSS 대신 rAF로 매 프레임 transform 갱신(스크립트 부하 테스트).
  const N = Math.max(1, Math.min(20000, parseInt(params.get("n"), 10) || 2000));
  const JS_MODE = params.get("js") === "1";
  const LOG = params.get("log") === "1";
  const W = window.innerWidth, H = window.innerHeight;

  const stage = document.getElementById("stage");
  const stats = document.getElementById("stats");

  // 결정적 유사난수 (재현성)
  let seed = 12345;
  const rand = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };

  const boxes = [];
  const frag = document.createDocumentFragment();
  for (let i = 0; i < N; i++) {
    const b = document.createElement("div");
    b.className = "box";
    const x = rand() * (W - 46), y = rand() * (H - 46);
    const hue = Math.floor(rand() * 360);
    b.style.left = x + "px";
    b.style.top = y + "px";
    b.style.background = `linear-gradient(135deg, hsl(${hue} 80% 60%), hsl(${(hue+60)%360} 80% 45%))`;
    if (JS_MODE) {
      // rAF로 직접 움직일 요소: 파라미터 저장
      boxes.push({ el: b, x, y, ph: rand() * Math.PI * 2, sp: 0.5 + rand() * 2 });
    } else {
      // CSS 애니메이션: 요소별로 이동량/회전/스케일/시간을 다르게
      const dx = (rand() * 2 - 1) * 300, dy = (rand() * 2 - 1) * 300;
      b.style.setProperty("--dx", dx.toFixed(0) + "px");
      b.style.setProperty("--dy", dy.toFixed(0) + "px");
      b.style.setProperty("--rot", (rand() * 720 - 360).toFixed(0) + "deg");
      b.style.setProperty("--sc", (0.4 + rand() * 1.4).toFixed(2));
      b.style.animationDuration = (1.5 + rand() * 3).toFixed(2) + "s";
      b.style.animationDelay = (-rand() * 5).toFixed(2) + "s";
    }
    frag.appendChild(b);
  }
  stage.appendChild(frag);

  // 측정 오버레이 (rAF FPS + 프레임 간격 지터)
  const startTime = performance.now();
  let lastSample = startTime, rafCount = 0, fps = 0;
  let lastFrameTs = startTime, maxGapMs = 0, jitterMs = 0;

  function tick(now) {
    rafCount++;
    const gap = now - lastFrameTs; if (gap > maxGapMs) maxGapMs = gap; lastFrameTs = now;

    if (JS_MODE) {
      // 스크립트가 매 프레임 모든 요소의 transform 을 직접 갱신 (메인 스레드 부하)
      const t = (now - startTime) / 1000;
      for (const o of boxes) {
        const tx = Math.sin(t * o.sp + o.ph) * 200;
        const ty = Math.cos(t * o.sp * 0.8 + o.ph) * 200;
        o.el.style.transform = `translate(${tx.toFixed(1)}px,${ty.toFixed(1)}px) rotate(${(t*o.sp*60).toFixed(1)}deg)`;
      }
    }

    const dt = now - lastSample;
    if (dt >= 1000) {
      fps = rafCount * 1000 / dt; jitterMs = maxGapMs;
      if (LOG) console.error(`[ANIMSTRESS] n=${N} mode=${JS_MODE?'js':'css'} fps=${fps.toFixed(1)} maxGapMs=${jitterMs.toFixed(1)}`);
      rafCount = 0; lastSample = now; maxGapMs = 0;
    }
    stats.textContent = [
      `complex animation stress`,
      `elements: ${N}`,
      `mode: ${JS_MODE ? "js (rAF transform)" : "css (@keyframes)"}`,
      `rAF FPS: ${fps.toFixed(1)}`,
      `jitter(maxGap): ${jitterMs.toFixed(1)} ms`,
      `elapsed: ${((now - startTime)/1000).toFixed(0)}s`,
    ].join("\n");
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
</body>
</html>
