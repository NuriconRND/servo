<!doctype html>
<!--
  Devtools panic repro: one pipeline hands devtools its source content twice.

  `document.open()` associates a SECOND, script-created parser with the SAME document
  (HTML spec "document open steps" step 16 -> `ServoParser::parse_html_script_input`).
  When that parser finishes, `ServoParser::finish` sends another
  `ScriptToDevtoolsControlMsg::UpdateSourceContent` carrying the pipeline id we already
  reported after the first parse. `ActorRegistry::set_inline_source_content` used to
  assert the map entry was vacant, so the Devtools thread panicked:

      thread 'Devtools' panicked at components\devtools\actor.rs:
      assertion failed: ... .insert(pipeline_id, content).is_none()

  and every later send failed with "DevTools send failed: sending on a disconnected
  channel". Real pages hit this through frames that build themselves with
  `document.write` (ad/embed iframes); this file reproduces it without the network.

  ★The devtools server must be running — the source text is only collected when
  `document.global().devtools_chan()` is Some (`servoparser/mod.rs`, ServoParser::
  new_inherited). Without `--pref devtools_server_enabled=true` nothing is sent and
  the page looks fine either way.★

  Run (release; a debug build is known to crash on the wall with dynamic content):

    target\release\examples\winit_wall.exe --wall-all-tiles ^
      --wall-layout ..\config\wall_layout.local_2x1.json ^
      --pref devtools_server_enabled=true ^
      --pref devtools_server_listen_address=127.0.0.1:7000 ^
      "file:///W:/servo_multigpu-tiled-wall/tests/html/devtools_document_write_repro.html"

  PASS = the frames below report "rewritten" and stderr shows no 'Devtools' panic and
  no "DevTools send failed" flood. FAIL = the panic above appears.
-->
<html lang="en"><head><meta charset="utf-8"><title>Devtools document.write repro</title>
<style>
  html, body { margin: 0; padding: 32px; background: #10131c;
               font-family: system-ui, "Segoe UI", sans-serif; color: #e8e8f0; }
  h1 { font-size: 28px; margin: 0 0 8px; }
  p  { font-size: 16px; color: #9aa; margin: 0 0 24px; }
  /* Keep frame backgrounds LIGHT. Servo's built-in error page (neterror.html) has no CSS,
     so its canvas stays transparent and the default text colour is black — a dark frame
     background renders a failed load as black-on-black and reads as "nothing painted". */
  iframe { width: 420px; height: 150px; background: #f4f4f8; border: 2px solid #c56cf0;
           border-radius: 6px; margin-right: 16px; }
  #status { margin-top: 24px; font-family: monospace; font-size: 16px; color: #e6c8ff; }
</style></head>
<body>
  <h1>devtools <code>document.write</code> repro</h1>
  <p>Each frame is parsed once from its <code>srcdoc</code>, then re-parsed by
     <code>document.open()</code> — two source reports for one pipeline id.</p>

  <iframe id="f1" title="rewritten frame 1"></iframe>
  <iframe id="f2" title="rewritten frame 2"></iframe>
  <iframe id="f3" title="rewritten frame 3"></iframe>

  <div id="status">status: starting…</div>

  <script>
    const clog = (m) => console.log("[devtools-repro] " + m);
    const statusEl = document.getElementById("status");

    // First parse: plain srcdoc. This is the source content devtools records first.
    const FIRST = "<!doctype html><meta charset=utf-8>" +
      "<style>html,body{margin:0;font:16px system-ui;color:#222;padding:12px}</style>" +
      "<b>first parse</b> (srcdoc)";

    let rewritten = 0;
    const frames = ["f1", "f2", "f3"].map((id) => document.getElementById(id));

    frames.forEach((frame, i) => {
      frame.addEventListener("load", () => {
        // Guard: the rewrite below fires another load event on some engines.
        if (frame.dataset.done) return;
        frame.dataset.done = "1";

        // Second parse of the SAME document/pipeline — this is the trigger.
        const doc = frame.contentDocument;
        doc.open();
        doc.write("<!doctype html><meta charset=utf-8>" +
          "<style>html,body{margin:0;font:16px system-ui;color:#0a7d32;padding:12px}</style>" +
          "<b>rewritten</b> via document.open()/write()/close() — frame " + (i + 1));
        doc.close();

        rewritten++;
        clog("frame " + (i + 1) + " rewritten (" + rewritten + "/" + frames.length + ")");
        statusEl.textContent = "status: rewritten " + rewritten + "/" + frames.length +
          " — devtools must still be alive";
      });
      frame.srcdoc = FIRST;
    });

    // Heartbeat so a dead devtools thread is obvious in the log tail.
    let n = 0;
    setInterval(() => clog("heartbeat " + (++n) + " rewritten=" + rewritten), 2000);
  </script>
</body></html>
