<!--
  Phase: capture-card / camera input probe (multi-GPU wall) via getUserMedia.

  Verifies that GStreamer video capture device providers (mediafoundation / winks /
  directshow) are registered so navigator.mediaDevices can enumerate and open a
  videoinput device (e.g. an HDMI capture card), and presents it full-bleed in a
  <video> — on the wall this fans out to every tile through the existing media
  external-image broadcast (raw passthrough, no VP8 roundtrip).

  Run (normal window, interactive — the buttons below work here):
    servoshell.exe --pref dom_webrtc_enabled=true tests/html/multigpu_capture_card_probe.html
  Run (wall fan-out, servoshell):
    servoshell.exe --wall-layout ..\config\wall_layout.local_3x1.json --wall-all-tiles \
      --pref dom_webrtc_enabled=true tests/html/multigpu_capture_card_probe.html
  Run (wall fan-out, winit_wall — this is what the on-hardware procedure uses):
    etc\multigpu\run_wall_dist.ps1 -PageFeatures -Serve `
      -Url "multigpu_capture_card_probe.html?cycles=20"

  ***winit_wall never forwards input to the engine*** — its event loop handles
  only CloseRequested and RedrawRequested — so the buttons in the .controls
  panel are unreachable there. Drive it from the query string instead:
  ?cycles=N runs N page transitions with no click, and ?cycles=N,stop
  additionally calls track.stop() before each one. One comma-separated
  parameter, no `&`: the launcher hands the URL to the engine through
  `cmd start`, where `&` is a command separator, and a URL truncated there
  still loads the page -- so the dropped option looks like a passing run.
  See the note above the cycle code for which release path each exercises.

  The HUD (top-left) lists every videoinput device and live stats for the opened
  one. With no capture device: 0 videoinput + getUserMedia 0 tracks, but NO
  crash/abort (that alone confirms the capture plugins loaded).

  Select a specific port two ways:
    ?cycles=10,hold3,dev2   the devN token -- use this from the launcher, where
                            a second `&`-joined parameter would be eaten
    ?device=<N|substring>   a separate parameter, for interactive servoshell;
                            a decimal N is an index, anything else matches
                            case-insensitively against device labels
  ?device= wins when both are given. The devN token is re-emitted on every
  transition, so the port stays selected for the whole cycle run. Selection
  opens with { video: { deviceId: { exact: id } } }; no selector keeps the
  legacy { video: true } first-device behavior, and a selector that matches
  nothing fails loudly (no track) instead of silently opening another port.

  ***The index is enumerateDevices() order, which is not the number printed on
  the card.*** The ks and mediafoundation views of this hardware enumerate in
  different orders (measured: ks 01,03,02,04 / mf 04,01,03,02), so read the
  HUD's device list -- it prints every index with its label -- rather than
  assuming index 2 is port 2.

  The .controls panel (bottom-left) reproduces a shared-connection capture
  hub scenario on demand, for the on-hardware procedure in
  docs/multigpu/capture_card_shared_connection.md:
    - "stop() the current track" calls track.stop() on every track of the
      live stream (window.currentStream) — exercises Task 6's release path.
    - "reload N times" drives N page transitions on its own (a self-navigating
      loop whose counter rides in the URL) — exercises the capture hub's
      reuse-not-reopen path (capture_hub.rs) the way repeated getUserMedia()
      calls across page navigations would. ?cycles=N does the same with no
      click, which is how the wall runs it.
-->
<html>
<head>
  <meta charset="utf-8" />
  <title>multigpu capture card probe</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #stage { position: fixed; inset: 0; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    #hud {
      position: fixed; left: 12px; top: 12px; z-index: 10; max-width: 60vw;
      font: 13px/1.45 monospace; color: #0f0; background: rgba(0,0,0,.62);
      padding: 10px 12px; border: 1px solid #0f0; white-space: pre-wrap;
    }
    #hud b { color: #6f6; }
    .controls {
      position: fixed; left: 12px; bottom: 12px; z-index: 10; max-width: 60vw;
      font: 13px/1.45 monospace; color: #0f0; background: rgba(0,0,0,.62);
      padding: 10px 12px; border: 1px solid #0f0;
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .controls button {
      font: 13px/1.45 monospace; color: #0f0; background: #001a00;
      border: 1px solid #0f0; padding: 4px 8px; cursor: pointer;
    }
    .controls label { display: flex; align-items: center; gap: 4px; }
    .controls input[type="number"] {
      width: 4.5em; font: 13px/1.45 monospace; color: #0f0; background: #001a00;
      border: 1px solid #0f0;
    }
    #cycle-status { color: #6f6; }
  </style>
</head>
<body>
  <div id="stage"><video id="v" autoplay playsinline muted></video></div>
  <div id="hud">starting…</div>
  <div class="controls">
    <button id="stop-track">stop() the current track</button>
    <label>reload cycles <input id="cycle-count" type="number" value="20" min="1" max="200"></label>
    <button id="start-cycles">reload N times</button>
    <span id="cycle-status"></span>
  </div>
  <script>
    const hud = document.getElementById("hud");
    const v = document.getElementById("v");
    let deviceLines = "(enumerating…)";
    let liveLines = "";
    let frames = 0, lastT = -1, fps = 0, fpsWin = 0, fpsT0 = 0;

    // Query parsing lives here, above start(), because the port selector is one
    // of the `cycles` tokens: from the launcher a second parameter is not usable
    // (`&` is a command separator to `cmd start`, and a URL truncated there still
    // loads the page, so the dropped selector would look like a passing run on
    // the wrong port).
    const params = new URLSearchParams(location.search);
    const cycleTokens = (params.get("cycles") || "").split(",").map(t => t.trim());
    // ?cycles=...,dev2  selects videoinput index 2. ?device=<N|substring> still
    // works and wins when both are given, for interactive servoshell use.
    const devToken = cycleTokens.find(t => /^dev\d+$/.test(t));
    const deviceSelector = params.get("device") !== null
      ? params.get("device")
      : (devToken ? devToken.slice(3) : null);

    function render() {
      hud.innerHTML = "<b>capture-card probe</b>\n" + deviceLines +
        (liveLines ? "\n\n" + liveLines : "");
    }
    function clog(m) { console.log("[capture-card-probe] " + m); }

    async function start() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        deviceLines = "mediaDevices UNAVAILABLE\n(enable --pref dom_webrtc_enabled=true)";
        render(); return;
      }

      // 1) enumerate
      let devs = [];
      try {
        devs = (await navigator.mediaDevices.enumerateDevices())
          .filter(d => d.kind === "videoinput");
        clog("enumerateDevices: " + devs.length + " videoinput");
        deviceLines = "videoinput devices: " + devs.length;
        devs.forEach((d, i) => {
          const line = `  [${i}] label="${d.label}" id=${d.deviceId || "(empty)"}`;
          deviceLines += "\n" + line;
          clog(line.trim());
        });
      } catch (e) { deviceLines = "enumerateDevices FAILED: " + e; }
      render();

      // 2) pick the port: ?cycles=...,devN or ?device=<N|substring>
      //    (default: first device)
      const sel = deviceSelector;
      let constraints = { video: true };
      if (sel !== null) {
        const chosen = /^\d+$/.test(sel)
          ? devs[Number(sel)]
          : devs.find(d => (d.label || "").toLowerCase().includes(sel.toLowerCase()));
        if (!chosen) {
          liveLines = `NO videoinput matches ?device=${JSON.stringify(sel)}`;
          clog(liveLines); render(); return;
        }
        constraints = { video: { deviceId: { exact: chosen.deviceId } } };
        deviceLines += `\nselected: "${chosen.label}"\n  id=${chosen.deviceId}`;
        clog(`selected device: label="${chosen.label}" id=${chosen.deviceId}`);
        render();
      }

      // 3) open
      try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        window.currentStream = stream; // reachable by the stop-track button below
        v.srcObject = stream;
        const track = stream.getVideoTracks()[0];
        let settings = {};
        try { settings = track.getSettings ? track.getSettings() : {}; } catch (e) {}
        clog("opened track: " + (track && track.label) + " settings=" + JSON.stringify(settings));

        // Real fps only via requestVideoFrameCallback (counts decoded frames).
        // If unavailable (current Servo), report n/a — the authoritative cadence is
        // in servoshell stderr ("GStreamer video sample ... duration_ms=16.667" = 60fps).
        const haveRVFC = !!v.requestVideoFrameCallback;
        if (haveRVFC) {
          const onFrame = () => { fpsWin++; v.requestVideoFrameCallback(onFrame); };
          v.requestVideoFrameCallback(onFrame);
        }

        setInterval(() => {
          const t = v.currentTime;
          const advancing = t !== lastT;
          lastT = t;
          fps = fpsWin; fpsWin = 0;
          const fpsLine = haveRVFC ? ("\nfps: " + fps) : "\nfps: n/a (see servoshell stderr duration_ms)";
          const s = settings && settings.width
            ? "\ntrack: " + settings.width + "x" + settings.height + "@" + (settings.frameRate || "?")
            : "";
          liveLines =
            "STREAM: " + (track ? "1 track" : "no track") + (advancing ? " (advancing)" : " (STALLED)") +
            "\nvideoSize: " + v.videoWidth + "x" + v.videoHeight +
            "\ncurrentTime: " + t.toFixed(2) + fpsLine + s;
          render();
          clog("live videoSize=" + v.videoWidth + "x" + v.videoHeight +
               " t=" + t.toFixed(2) + (advancing ? " advancing" : " STALLED"));
        }, 1000);
      } catch (e) {
        liveLines = "getUserMedia FAILED: " + e; render();
        clog("getUserMedia FAILED: " + e);
      }
    }
    render();
    start();

    // --- reproduce page transitions on demand (see docs/multigpu/capture_card_shared_connection.md) ---

    document.getElementById("stop-track").addEventListener("click", () => {
      const stream = window.currentStream;
      if (!stream) {
        document.getElementById("cycle-status").textContent = "no live stream to stop";
        return;
      }
      for (const track of stream.getTracks()) { track.stop(); }
      document.getElementById("cycle-status").textContent = "stopped";
      clog("stop-track: stopped all tracks of window.currentStream");
    });

    // Drives N page transitions in a row, reproducing the failure mode this
    // branch fixes: a getUserMedia() call on every page load, previously never
    // released. A full navigation clears all JS state, so the done/total counts
    // have to survive outside it -- see the note below on where they live and
    // why. The status line shows "cycle X/N" and stops once X reaches N.
    const cycleStatus = document.getElementById("cycle-status");

    // The cycle counter lives in the URL, NOT in sessionStorage.
    //
    // ***sessionStorage is not available on the wall.*** Measured 2026-09-04 on the
    // test machine: the engine logs
    //   storage::client_storage] Failed to initialize ClientStorage engine ...
    //   CannotOpen "unable to open database file: ...\Temp\.tmp*\clientstorage\..."
    // and every getItem then returns null (or throws), so a storage-backed counter
    // reads back as "no run in progress" on the very first load and the loop never
    // starts. That failure is silent from the page's side and looked exactly like a
    // passing run: one `capture hub: opened`, no panics, and nothing transitioned.
    // The URL survives a navigation by construction and needs no engine subsystem.
    //
    // Syntax, deliberately using ONE parameter with comma-separated tokens so no `&`
    // is needed -- the launcher hands the URL to the engine through `cmd start`,
    // where `&` is a command separator:
    //   ?cycles=20            20 transitions, no stop()
    //   ?cycles=20,stop       20 transitions, track.stop() before each
    //   ?cycles=20,stop,d3    ...as rewritten by the page itself; d<n> = done count
    // `&stop=1` is still honored if it does arrive intact.
    //
    // Leave stop off to exercise the path that actually matters -- a page that
    // releases nothing and relies on pipeline exit to do it -- which is what a real
    // page does and what the reported crash came from. Run it once with `,stop` to
    // cover the explicit-release path separately; keeping them apart is what makes a
    // failure attributable to one path or the other.
    const cycleTotal = parseInt(cycleTokens[0] || "0", 10);
    const stopEachCycle = cycleTokens.includes("stop") || params.get("stop") === "1";
    const doneToken = cycleTokens.find(t => /^d\d+$/.test(t));
    const cycleDone = doneToken ? parseInt(doneToken.slice(1), 10) : 0;
    // hold<N>: seconds to keep the picture on screen once it is actually up.
    const holdToken = cycleTokens.find(t => /^hold\d+$/.test(t));
    const holdSec = holdToken ? parseInt(holdToken.slice(4), 10) : 3;

    // Wait until the stream is really on screen, not merely requested.
    //
    // ***The timer used to start at page load, and that made the probe useless
    // on the wall.*** Measured 2026-09-04: getUserMedia took most of the delay,
    // so the consumer was added and removed inside the same second -- the log
    // showed `consumer N added` and `consumer N removed` with the same
    // timestamp, out of a 14-second cycle. The picture was up for a fraction of
    // a second every cycle, so an operator watching the wall saw nothing and
    // could not tell a working capture path from a broken one.
    //
    // Resolve on the first frame that has real dimensions and an advancing
    // clock. Give up after a cap and resolve anyway: a port that never opens
    // must not wedge the whole run, it should just show up as a cycle with no
    // `capture hub` lines.
    function whenPictureIsUp(capMs) {
      return new Promise(resolve => {
        const t0 = Date.now();
        (function poll() {
          if (v.videoWidth > 0 && v.currentTime > 0) { resolve("up"); return; }
          if (Date.now() - t0 >= capMs) { resolve("timeout"); return; }
          setTimeout(poll, 100);
        })();
      });
    }

    // Rebuild the whole query so an operator's ?device= selector survives every
    // transition; only the `cycles` value changes.
    function cycleUrl(done) {
      const next = new URLSearchParams(location.search);
      // Every token the next document needs has to be re-emitted here -- anything
      // left out silently reverts to its default on the very next transition.
      next.set("cycles",
        [
          String(cycleTotal),
          stopEachCycle ? "stop" : null,
          devToken || null,
          "hold" + holdSec,
          "d" + done,
        ].filter(Boolean).join(","));
      return location.pathname + "?" + next.toString();
    }

    document.getElementById("start-cycles").addEventListener("click", () => {
      const count = parseInt(document.getElementById("cycle-count").value, 10);
      if (!Number.isFinite(count) || count < 1) {
        cycleStatus.textContent = "enter a cycle count of 1 or more";
        return;
      }
      const next = new URLSearchParams(location.search);
      next.set("cycles", String(count));
      location.href = location.pathname + "?" + next.toString();
    });

    (function runCycleStep() {
      if (!Number.isFinite(cycleTotal) || cycleTotal < 1) { return; }
      const done = cycleDone + 1;
      const mode = stopEachCycle ? "stop+navigate" : "navigate";

      if (done >= cycleTotal) {
        cycleStatus.textContent = `cycles done (${done}/${cycleTotal}, ${mode})`;
        clog(`cycle ${done}/${cycleTotal} (final, ${mode})`);
        return;
      }

      cycleStatus.textContent = `cycle ${done}/${cycleTotal} (${mode}) — waiting for picture`;
      clog(`cycle ${done}/${cycleTotal} (${mode}) waiting for picture`);

      whenPictureIsUp(20000).then(how => {
        cycleStatus.textContent =
          `cycle ${done}/${cycleTotal} (${mode}) — picture ${how}, holding ${holdSec}s`;
        clog(`cycle ${done}/${cycleTotal}: picture ${how}, holding ${holdSec}s`);
        setTimeout(() => {
          if (stopEachCycle && window.currentStream) {
            for (const track of window.currentStream.getTracks()) { track.stop(); }
            clog(`cycle ${done}/${cycleTotal}: stopped all tracks before navigating`);
          }
          // replace(), not assign(): N transitions should not build N history
          // entries. It is still a full navigation, which is the point -- each
          // one tears the document down and runs the pipeline-exit release path.
          location.replace(cycleUrl(done));
        }, holdSec * 1000);
      });
    })();
  </script>
</body>
</html>
