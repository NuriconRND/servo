<!--
  Phase: capture-card / camera input probe (multi-GPU wall) via getUserMedia.

  Verifies that GStreamer video capture device providers (mediafoundation / winks
  / directshow) are registered so navigator.mediaDevices can enumerate and open a
  videoinput device, and presents the first one full-bleed in a <video>.

  Run requires:
    --pref dom_webrtc_enabled --pref dom_screen_capture_enabled (latter not needed
    for getUserMedia but harmless)
  With no capture device connected: enumerateDevices shows 0 videoinput and
  getUserMedia yields 0 tracks (but must NOT error / abort — that confirms the
  plugins loaded).
-->
<html>
<head>
  <meta charset="utf-8" />
  <title>multigpu capture card probe</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #stage { position: fixed; inset: 0; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    #hud {
      position: fixed; left: 12px; top: 12px; z-index: 10;
      font: 13px/1.4 monospace; color: #0f0; background: rgba(0,0,0,.55);
      padding: 8px 10px; border: 1px solid #0f0; white-space: pre;
    }
  </style>
</head>
<body>
  <div id="stage"><video id="v" autoplay playsinline muted></video></div>
  <div id="hud">starting…</div>
  <script>
    const hud = document.getElementById("hud");
    const v = document.getElementById("v");
    function log(msg) { hud.textContent = msg; console.log("[capture-card-probe] " + msg); }

    async function start() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        log("mediaDevices UNAVAILABLE\n(enable dom_webrtc_enabled)");
        return;
      }
      // 1. enumerate devices
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const vids = devices.filter(d => d.kind === "videoinput");
        console.log("[capture-card-probe] enumerateDevices: " + devices.length +
          " total, " + vids.length + " videoinput");
        vids.forEach((d, i) => console.log(`  videoinput[${i}] id=${d.deviceId} label="${d.label}"`));
        log("videoinput devices: " + vids.length);
      } catch (e) {
        log("enumerateDevices FAILED:\n" + e);
      }
      // 2. open first video input
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        const tracks = stream.getVideoTracks();
        v.srcObject = stream;
        let last = -1;
        setInterval(() => {
          const t = v.currentTime.toFixed(2);
          const advancing = v.currentTime !== last; last = v.currentTime;
          log("getUserMedia live\ntracks: " + tracks.length +
              "\nvideoSize: " + v.videoWidth + "x" + v.videoHeight +
              "\ncurrentTime: " + t + (advancing ? " (advancing)" : " (STALLED)"));
        }, 1000);
      } catch (e) {
        log("getUserMedia FAILED:\n" + e);
      }
    }
    start();
  </script>
</body>
</html>
