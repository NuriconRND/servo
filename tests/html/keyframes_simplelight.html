<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>keyframes simple light (no PMREM)</title>
<style>body{margin:0;background:#202428;color:#eee;font:13px monospace}#info{position:absolute;top:6px;left:6px;z-index:10;white-space:pre;background:rgba(0,0,0,.5);padding:6px}</style>
<!-- threejs.org의 three를 importmap으로 사용. 씬만 단순 조명으로 교체(PMREM/Sky 제거). -->
<script type="importmap">{ "imports": {
  "three": "https://threejs.org/build/three.module.js",
  "three/addons/": "https://threejs.org/examples/jsm/"
}}</script>
</head><body>
<div id="info">loading…</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
const info = document.getElementById('info');
function log(m){ info.textContent = m; try{console.log('[SIMPLELIGHT] '+m)}catch(e){} }

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x88aacc);           // 단색 배경(검정 아님 확인용)
// PMREM/Sky 대신 단순 조명
scene.add(new THREE.HemisphereLight(0xffffff, 0x444466, 3.0));
const dir = new THREE.DirectionalLight(0xffffff, 2.5); dir.position.set(5, 10, 7); scene.add(dir);
scene.add(new THREE.AmbientLight(0xffffff, 0.6));

const camera = new THREE.PerspectiveCamera(40, window.innerWidth/window.innerHeight, 1, 100);
camera.position.set(5, 2, 8);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.7, 0); controls.update();

const draco = new DRACOLoader(); draco.setDecoderPath('https://threejs.org/examples/jsm/libs/draco/gltf/');
const loader = new GLTFLoader(); loader.setDRACOLoader(draco);
let mixer = null;
loader.load('https://threejs.org/examples/models/gltf/LittlestTokyo.glb', (gltf) => {
  const model = gltf.scene; model.position.set(1, 1, 0); model.scale.set(0.01, 0.01, 0.01);
  scene.add(model);
  mixer = new THREE.AnimationMixer(model); mixer.clipAction(gltf.animations[0]).play();
  log('model loaded; meshes=' + (()=>{let n=0;model.traverse(o=>{if(o.isMesh)n++});return n})());
}, undefined, (e) => log('LOAD ERROR: ' + (e && e.message || e)));

let probed = false;
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  if (mixer) mixer.update(clock.getDelta());
  controls.update();
  renderer.render(scene, camera);
  if (!probed && mixer) {
    probed = true;
    const gl = renderer.getContext();
    const px = new Uint8Array(4);
    gl.readPixels((renderer.domElement.width/2)|0, (renderer.domElement.height/2)|0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
    log('rendered; centerPixel=[' + px[0] + ',' + px[1] + ',' + px[2] + '] (모델이 보이면 텍스처 OK)');
  }
}
animate();
</script></body></html>
