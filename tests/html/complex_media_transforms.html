<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>복합 미디어 변형 데모 — 12영상(회전/3D/이동 혼재)+티커+PiP+통계</title>
<style>
  /* 관례: 불투명 배경, 비디오 그리드는 100vh 단일 플로우 블록(flex-wrap),
     오버레이는 전부 fixed. float 금지, rAF 하트비트 필수.
     complex_media_stress.html 파생 — 그리드 타일 3개에 변형 애니메이션 추가:
       Z-회전/3D Y-플립 = WR 승격 불가(ComplexTransform) → 콘텐츠 패스 폴백,
       이동·스케일(2D scale+translation) = external 승격 유지.
     external(-VideoEscape external) 모드에서 승격/폴백 혼재를 한 화면에서 검증. */
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: "Malgun Gothic", ui-sans-serif, sans-serif;
  }

  /* ── 비디오 그리드 (베이스, 불투명 슬라이스) ── */
  #grid {
    display: flex;
    flex-wrap: wrap;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
  }
  #grid .cell {
    box-sizing: border-box;
    flex: 0 0 auto;
    position: relative;
    background: #000;
    overflow: visible;
  }
  #grid video {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: fill;
    background: #000;
  }
  /* 변형 3종 — 시각 기반 CSS 애니메이션 (stylo 구동) */
  .fx-spinz video {
    animation: spinZ 12s linear infinite;
    will-change: transform;
  }
  @keyframes spinZ {
    from { transform: rotate(0deg) scale(0.78); }
    to   { transform: rotate(360deg) scale(0.78); }
  }
  .fx-flipy video {
    animation: flipY 9s linear infinite;
    will-change: transform;
  }
  @keyframes flipY {
    from { transform: perspective(70vh) rotateY(0deg) scale(0.9); }
    to   { transform: perspective(70vh) rotateY(360deg) scale(0.9); }
  }
  .fx-bob video {
    animation: bob 7s ease-in-out infinite;
    will-change: transform;
  }
  @keyframes bob {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(1.6vw, 1.8vh) scale(0.82); }
    100% { transform: translate(0, 0) scale(1); }
  }
  /* 변형 타일 배지 — 어느 경로인지 육안 표시 */
  .badge {
    position: absolute;
    left: 0.4vw; top: 0.6vh;
    z-index: 3;
    background: rgba(10, 20, 35, 0.8);
    border: 1px solid #3a516b;
    border-radius: 0.5vh;
    color: #ffd479;
    font-size: 1.7vh;
    padding: 0.3vh 0.6vw;
    pointer-events: none;
  }
  .badge.ext { color: #7dffb2; }

  /* ── 상단 정보 바 (fixed 오버레이) ── */
  #topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 7vh;
    z-index: 6;
    background: #101820;
    color: #e8edf2;
    display: flex;
    align-items: center;
    gap: 1.6vw;
    padding: 0 1.2vw;
    box-sizing: border-box;
    border-bottom: 2px solid #2a3b4d;
  }
  #logo {
    width: 4vh; height: 4vh;
    background: linear-gradient(135deg, #ff6a00, #ffc400);
    animation: spin 5s linear infinite;
  }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  #title { font-size: 2.6vh; font-weight: 700; }
  #live {
    margin-left: auto;
    display: flex; align-items: center; gap: 0.5vw;
    font-size: 2.4vh; font-weight: 700; color: #ff4545;
  }
  #live .dot {
    width: 1.5vh; height: 1.5vh; border-radius: 50%;
    background: #ff4545;
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.6); opacity: 0.35; } }
  #clock { font-size: 2.8vh; font-variant-numeric: tabular-nums; color: #9fd4ff; }

  /* ── 하단 메인 티커 (우→좌, 24s) ── */
  #tickerbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 9vh;
    z-index: 6;
    background: #0b1220;
    border-top: 2px solid #2a3b4d;
    display: flex; align-items: center;
    overflow: hidden;
  }
  #tickerlabel {
    flex: 0 0 auto;
    height: 100%;
    display: flex; align-items: center;
    padding: 0 1.4vw;
    background: #c8102e;
    color: #fff;
    font-size: 2.8vh; font-weight: 700;
    z-index: 2;
  }
  #ticker {
    position: absolute;
    left: 0;
    white-space: nowrap;
    color: #dfe8f2;
    font-size: 3vh;
    will-change: transform;
    animation: tick 24s linear infinite;
  }
  @keyframes tick { from { transform: translateX(100vw); } to { transform: translateX(-100%); } }

  /* ── PiP 오버레이 영상 (좌하단, 알파 패널 위 비디오) ── */
  #pip {
    position: fixed;
    left: 1.2vw; bottom: 11vh;
    width: 20vw;
    z-index: 7;
    background: rgba(8, 14, 24, 0.72);
    border: 2px solid #3a516b;
    border-radius: 0.8vh;
    padding: 0.5vw;
    box-sizing: border-box;
    will-change: transform;
  }
  #pip .caption { color: #9fd4ff; font-size: 1.9vh; padding-bottom: 0.3vh; }
  #pip video { width: 100%; display: block; }

  /* ── 통계 패널 (우상단, 4Hz JS 갱신) ── */
  #stats {
    position: fixed;
    right: 1.2vw; top: 13vh;
    width: 17vw;
    z-index: 7;
    background: rgba(10, 20, 35, 0.68);
    border: 1px solid #2a3b4d;
    border-radius: 0.8vh;
    color: #cfe3f5;
    font-size: 2vh;
    padding: 1vh 1vw;
    font-variant-numeric: tabular-nums;
  }
  #stats .row { display: flex; justify-content: space-between; padding: 0.3vh 0; }
  #stats .val { color: #7dffb2; }

  /* ── 중앙 하단 자막 (반투명, 9s 슬라이드 페이드) ── */
  #caption {
    position: fixed;
    left: 50%;
    bottom: 12vh;
    transform: translateX(-50%);
    background: rgba(10, 20, 35, 0.55);
    color: #fff;
    font-size: 3vh; font-weight: 600;
    padding: 1vh 2vw;
    border-radius: 1vh;
    text-shadow: 0 0 10px rgba(0,0,0,0.9);
    animation: capSlide 9s ease-in-out infinite;
    white-space: nowrap;
    z-index: 8;
  }
  @keyframes capSlide {
    0%, 12%   { opacity: 0; transform: translateX(-50%) translateY(2vh); }
    20%, 80%  { opacity: 1; transform: translateX(-50%) translateY(0); }
    88%, 100% { opacity: 0; transform: translateX(-50%) translateY(-1vh); }
  }

  /* rAF 하트비트 (필수) */
  #hb { position: fixed; right: 0; bottom: 0; width: 2px; height: 2px; background: #000; z-index: 20; }

  /* 동기 시작 커버 */
  #cover {
    position: fixed; inset: 0;
    background: #000; z-index: 30;
    display: flex; align-items: center; justify-content: center;
    color: #555;
    font-family: ui-monospace, Consolas, monospace;
    font-size: 24px;
  }
</style>
</head>
<body>
<div id="grid"></div>

<div id="topbar">
  <div id="logo"></div>
  <div id="title">변형 혼재 데모 — Z-회전·3D 플립(WR 폴백) + 이동·스케일(external 유지)</div>
  <div id="live"><span class="dot"></span>LIVE</div>
  <div id="clock">--:--:--</div>
</div>

<div id="pip">
  <div class="caption">PiP 오버레이(알파 패널 위 비디오 — external)</div>
  <video id="pipv" muted loop playsinline preload="auto"></video>
</div>

<div id="stats">
  <div class="row"><span>디코드 fps</span><span class="val" id="s1">--</span></div>
  <div class="row"><span>큐 깊이</span><span class="val" id="s2">--</span></div>
  <div class="row"><span>대역폭(MB/s)</span><span class="val" id="s3">--</span></div>
  <div class="row"><span>드롭</span><span class="val" id="s4">--</span></div>
</div>

<div id="caption">변형 혼재 자막 — 승격/폴백이 비디오 단위로 갈리는 화면</div>

<div id="tickerbar">
  <div id="tickerlabel">데모</div>
  <div id="ticker">변형 혼재 페이지 · Z-회전과 3D Y-플립 타일은 WR 콘텐츠 패스로 폴백, 이동·스케일 타일과 나머지 9개+PiP는 external 스왑체인 직결 · 회전이 부드럽고 나머지가 lockstep이면 혼재 경로 정상 ·&nbsp;</div>
</div>

<div id="hb"></div>
<div id="cover">준비 중...</div>

<script>
  "use strict";

  const params = new URLSearchParams(location.search);
  const clampInt = (raw, fb) => {
    const n = parseInt(raw, 10);
    return Number.isFinite(n) ? Math.max(1, Math.min(16, n)) : fb;
  };
  const COLS = clampInt(params.get("cols"), 4);
  const ROWS = clampInt(params.get("rows"), 3);
  const TILE_COUNT = COLS * ROWS;
  const DEFAULT_SRC = "../Wildlife_FHD30fps_counter_10Mbitrate.mp4";
  const srcParam = params.get("src");
  const SRC = (srcParam && srcParam.trim()) ? srcParam.trim() : DEFAULT_SRC;

  // 변형 배정: 타일 인덱스 → (클래스, 배지 문구). 그리드 크기가 바뀌어도 안전하게 존재 인덱스만 적용.
  const FX = new Map([
    [1, { cls: "fx-spinz", label: "Z-회전 → WR 폴백", ext: false }],
    [6, { cls: "fx-flipy", label: "3D Y-플립 → WR 폴백", ext: false }],
    [9, { cls: "fx-bob",  label: "이동·스케일 → external 유지", ext: true }],
  ]);

  // 비디오 그리드 (셀 래퍼 + 내부 비디오에 변형)
  const grid = document.getElementById("grid");
  const tileW = (100 / COLS) + "vw";
  const tileH = (100 / ROWS) + "vh";
  const videos = [];
  for (let i = 0; i < TILE_COUNT; i++) {
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.style.width = tileW; cell.style.height = tileH;
    const fx = FX.get(i);
    if (fx) {
      cell.classList.add(fx.cls);
      const badge = document.createElement("div");
      badge.className = "badge" + (fx.ext ? " ext" : "");
      badge.textContent = fx.label;
      cell.appendChild(badge);
    }
    const v = document.createElement("video");
    v.muted = true; v.loop = true; v.playsInline = true; v.preload = "auto";
    v.src = SRC;
    v.play().catch(() => {});
    cell.insertBefore(v, cell.firstChild);
    grid.appendChild(cell);
    videos.push(v);
  }

  // PiP 영상 (그리드와 별도 — 알파 패널 위, external 승격 대상)
  const pipv = document.getElementById("pipv");
  pipv.src = SRC;
  pipv.play().catch(() => {});

  // 시계 (1Hz)
  const clock = document.getElementById("clock");
  const two = (n) => String(n).padStart(2, "0");
  setInterval(() => {
    const d = new Date();
    clock.textContent = two(d.getHours()) + ":" + two(d.getMinutes()) + ":" + two(d.getSeconds());
  }, 1000);

  // 통계 패널 (4Hz — 값은 결정적 파형)
  let tick4 = 0;
  setInterval(() => {
    tick4++;
    document.getElementById("s1").textContent = (29.2 + 1.6 * Math.sin(tick4 / 7)).toFixed(1);
    document.getElementById("s2").textContent = String(8 + Math.round(6 * Math.abs(Math.sin(tick4 / 11))));
    document.getElementById("s3").textContent = (38 + 20 * Math.abs(Math.sin(tick4 / 5))).toFixed(1);
    document.getElementById("s4").textContent = String(Math.round(tick4 / 40));
  }, 250);

  // 동기 시작 커버 (PiP 포함 전체 재생 관측 시 해제)
  const cover = document.getElementById("cover");
  const allVideos = videos.concat([pipv]);
  const syncBegin = performance.now();
  const revealPoll = setInterval(() => {
    const moving = allVideos.filter((v) => v.currentTime > 0).length;
    const elapsed = ((performance.now() - syncBegin) / 1000) | 0;
    cover.textContent = "준비 중... " + moving + "/" + allVideos.length + " (" + elapsed + "s)";
    if (moving >= allVideos.length || elapsed > 90) {
      clearInterval(revealPoll);
      if (cover.parentNode) cover.parentNode.removeChild(cover);
    }
  }, 250);

  // rAF 하트비트 (필수)
  const hb = document.getElementById("hb");
  let hbFrame = 0;
  (function heartbeat() {
    hbFrame++;
    hb.style.background = (hbFrame & 1) ? "#000001" : "#000000";
    requestAnimationFrame(heartbeat);
  })();
</script>
</body>
</html>
