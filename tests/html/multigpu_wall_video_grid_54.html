<!DOCTYPE html>
<!--
  Multi-GPU wall video stress page — 54 <video> tiles, ONE page filling the whole wall.

  Target wall: 2 displays wide x 3 tall, FHD (1920x1080) -> virtual viewport 3840x3240.
  This is a single logical surface (not split per display): a uniform 6 x 9 grid of 54
  videos spread across the entire viewport.

  Every <video> plays the SAME source. Change it in ONE place: the VIDEO_SRC constant
  below — all 54 tiles update. (COLS/ROWS below change the grid.)

  The dist packager (etc/multigpu/make_winit_wall_dist.ps1) rewrites the absolute
  file:///.../servo/test_media/ prefix to a relative test_media/ path automatically.
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Wall video grid — 54 (6x9, fills 2-wide x 3-tall wall)</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    /* Servo does not support CSS Grid (display:grid); use flexbox wrapping instead. */
    #grid { display: flex; flex-wrap: wrap; align-content: flex-start; width: 100vw; height: 100vh; }
    .cell { flex: none; position: relative; overflow: hidden; box-sizing: border-box; border: 1px solid rgba(255,255,255,0.15); }
    .cell video { width: 100%; height: 100%; object-fit: cover; display: block; background: #111; }
    .label { position: absolute; top: 2px; left: 2px; font: 14px/1.2 monospace; color: #0f0;
             background: rgba(0,0,0,0.55); padding: 1px 4px; pointer-events: none; }
  </style>
</head>
<body>
  <div id="grid"></div>

  <script>
    // === EDIT HERE: one source for all tiles ===========================
    const VIDEO_SRC = "file:///F:/20260609_SDWall_BrowserTest/20260606_multigpu_browser/servo/test_media/std.mp4";
    // ===================================================================

    // One grid over the whole wall: 6 columns x 9 rows = 54 videos.
    const COLS = 6, ROWS = 9;

    const grid = document.getElementById("grid");
    // Flexbox tiling: each cell is (100/COLS)% wide so COLS cells fill a row and wrap,
    // and (100/ROWS)% tall so ROWS rows fill the height.
    const cellWidth = 100 / COLS + "%";
    const cellHeight = 100 / ROWS + "%";

    const total = COLS * ROWS;
    for (let i = 0; i < total; i++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.style.width = cellWidth;
      cell.style.height = cellHeight;

      const video = document.createElement("video");
      video.src = VIDEO_SRC;
      video.muted = true;          // required for autoplay
      video.loop = true;
      video.autoplay = true;
      video.playsInline = true;
      video.setAttribute("muted", "");
      video.setAttribute("playsinline", "");
      // Best-effort kick in case the autoplay attribute is not honored.
      video.addEventListener("canplay", () => { video.play().catch(() => {}); });

      const label = document.createElement("div");
      label.className = "label";
      label.textContent = i + 1;

      cell.appendChild(video);
      cell.appendChild(label);
      grid.appendChild(cell);
    }
  </script>
</body>
</html>
