<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>min webgl2 triangle</title>
<style>html,body{margin:0;height:100%;background:#222}canvas{width:100%;height:100%;display:block}</style></head>
<body><canvas id="c"></canvas>
<script>
// 최소 WebGL2: FBO 없이 회전 삼각형만 그린다. fan-out 자체 동작 확인용.
const cv = document.getElementById('c');
const gl = cv.getContext('webgl2');
function log(m){ try{ console.log('[MINTRI] '+m); }catch(e){} }
if(!gl){ log('NO webgl2'); throw 'no gl'; }
log('webgl2 ok');
function resize(){ cv.width=innerWidth; cv.height=innerHeight; gl.viewport(0,0,cv.width,cv.height); }
addEventListener('resize',resize); resize();
const vs=`#version 300 es
in vec2 p; uniform float a; out vec3 col;
void main(){ float c=cos(a),s=sin(a); vec2 q=mat2(c,-s,s,c)*p; gl_Position=vec4(q,0.,1.); col=vec3(p*0.5+0.5,1.); }`;
const fs=`#version 300 es
precision highp float; in vec3 col; out vec4 o; void main(){ o=vec4(col,1.); }`;
function sh(t,src){ const s=gl.createShader(t); gl.shaderSource(s,src); gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)) log('shErr '+gl.getShaderInfoLog(s)); return s; }
const pr=gl.createProgram(); gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs)); gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(pr); gl.useProgram(pr);
const vao=gl.createVertexArray(); gl.bindVertexArray(vao);
const b=gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER,b);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([0,0.8,-0.8,-0.7,0.8,-0.7]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(pr,'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
const ua=gl.getUniformLocation(pr,'a');
let f=0;
function frame(){ f++; gl.clearColor(0.1,0.1,0.15,1); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.useProgram(pr); gl.bindVertexArray(vao); gl.uniform1f(ua,f*0.02); gl.drawArrays(gl.TRIANGLES,0,3);
  if(f===120) log('survived 120 frames'); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script></body></html>
