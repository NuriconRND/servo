<!doctype html>
<meta charset="utf-8">
<title>Multi-GPU Wall Video Minimal Probe</title>
<!--
  DComp 투명 구멍 진단용 대조 페이지.

  multigpu_wall_video_file_probe.html과 **같은 비디오 파일**을 쓰되, 레이아웃을 최소화한다:
  - 문서가 뷰포트를 넘지 않는다(min-width/min-height 없음, main 없음) — file_probe는 3840x1080
    뷰포트에서 5760x3240 문서라 크게 넘친다.
  - 비디오는 뷰포트 안에 완전히 들어가고 타일 경계 x=1920만 가로지른다.
  - controls / object-fit / border / box-shadow / 애니메이션 스트립 없음.

  판정: 이 페이지에서도 구멍이 나면 페이지 레이아웃은 무관하고 엔진(비디오 external 서피스 +
  DComp + 다중 창) 문제다. 구멍이 안 나면 file_probe의 어떤 속성이 트리거이므로 하나씩 되살려
  이분 탐색한다.
-->
<style>
  html, body {
    margin: 0;
    overflow: hidden;
    background: #111;
    color: #f4f4f4;
    font: 24px/1.3 ui-monospace, Consolas, monospace;
  }
  /* 타일 경계 x=1920에 얇은 기준선 — 구멍의 좌변이 여기 걸리는지 보기 위함 */
  .seam {
    position: absolute; left: 1918px; top: 0; width: 4px; height: 100%;
    background: #ff4757; z-index: 2;
  }
  /* 경계를 가로지르되 뷰포트 안에 완전히 들어가는 비디오 */
  video {
    position: absolute; left: 1520px; top: 240px;
    width: 800px; height: 450px;
    background: #000;
  }
  #stats { position: absolute; left: 48px; top: 48px; z-index: 3; white-space: pre; }
</style>
<div class="seam"></div>
<div id="stats">loading</div>
<video id="v" autoplay muted loop playsinline>
  <source src="../Wildlife_FHD30fps_counter_10Mbitrate.mp4" type="video/mp4">
</video>
<script>
  const v = document.getElementById("v");
  const stats = document.getElementById("stats");
  let raf = 0;
  v.play().catch(() => {});
  function tick() {
    raf += 1;
    stats.textContent = [
      "minimal video probe (DComp hole 대조군)",
      `viewport: ${document.documentElement.clientWidth}x${document.documentElement.clientHeight}`,
      `video box: left=1520 top=240 800x450 (seam x=1920 가로지름)`,
      `time: ${v.currentTime.toFixed(3)}  readyState: ${v.readyState}  raf: ${raf}`
    ].join("\n");
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
