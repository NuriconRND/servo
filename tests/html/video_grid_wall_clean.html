<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>6x6 Video Grid Wall (clean)</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
    color: #f4f4f4;
  }
  /* 그리드가 창(모니터)을 꽉 채움. gap 1px = 타일 경계 시각 확인용 */
  /* CSS Grid 대신 flex-wrap 사용: Servo의 grid 구현이 불완전해 트랙이 video
     내재 크기(1920x1080)로 blowout 되어 1개만 보이는 문제 회피. 각 타일 크기는
     JS에서 vw/vh로 명시 지정하므로 레이아웃이 내재 크기에 의존하지 않는다. */
  #grid {
    display: flex;
    flex-wrap: wrap;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #000;
  }
  #grid video {
    box-sizing: border-box;
    border: 1px solid #222; /* 타일 경계 시각 확인용 (border-box라 크기 불변) */
    flex: 0 0 auto;
    object-fit: cover;
    background: #000;
  }
  /* ?dom=1 혼합 케이스: 각 비디오 타일 위 테두리+라벨 오버레이 */
  #dom { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #dom .cap { position: absolute; box-sizing: border-box; border: 2px solid rgba(0,220,255,.9);
    color: #eafcff; font-size: 14px; padding: 2px 4px; text-shadow: 0 1px 2px #000; overflow: hidden; }
</style>
</head>
<body>
<div id="grid"></div>
<div id="dom"></div>
<script>
  "use strict";

  // 무하트비트 사본(스펙 §13): video_grid_6x6_perf.html에서 매프레임 DOM 갱신(#stats
  // rAF 루프)만 제거 — 그리드 생성/재생 로직은 원본과 동일. 콘텐츠층이 완전 정적이라
  // WR 래스터·콘텐츠 Present가 자연히 0이 된다(콘텐츠층 잔여 비용 3단 매트릭스의 ②단).

  // 그리드 크기 파라미터:
  //   ?grid=N       -> N x N (정사각, 기본 6 => 36 타일)
  //   ?cols=C&rows=R -> C열 x R행 직사각 (예: cols=9&rows=6 => 54 타일)
  // cols/rows 중 하나만 주면 나머지는 grid(없으면 6) 값을 사용.
  const params = new URLSearchParams(location.search);
  const clampInt = (raw, fallback) => {
    const n = parseInt(raw, 10);
    return Number.isFinite(n) ? Math.max(1, Math.min(16, n)) : fallback;
  };
  const gridN = clampInt(params.get("grid"), 6);
  const COLS = clampInt(params.get("cols"), gridN);
  const ROWS = clampInt(params.get("rows"), gridN);
  const TILE_COUNT = COLS * ROWS;
  const SRC = "../Wildlife_FHD30fps_counter_10Mbitrate.mp4";

  const grid = document.getElementById("grid");
  // 각 타일 크기를 뷰포트의 1/COLS x 1/ROWS 로 명시 (내재 크기 무시). flex-wrap 이 COLS개씩 줄바꿈.
  const tileW = (100 / COLS) + "vw";
  const tileH = (100 / ROWS) + "vh";

  // ?stagger=1 이면 각 타일을 타임라인상 다른 위치에서 시작(loop 시점 분산). 기본은 OFF
  // (동시 재생). 스태거는 40개 동시 loop로 인한 주기적 큰 스톨은 없애지만, 대신 프레임
  // 도착이 상시 분산되어 초당 미세 지터를 늘리는 트레이드오프가 있어 기본 비활성.
  const STAGGER = params.get("stagger") === "1";

  // ?dom=1: 각 타일 위에 DOM 테두리+라벨 오버레이를 얹어 "비디오+DOM 혼합" 케이스 측정
  const DOM = params.get("dom") === "1";
  const domLayer = document.getElementById("dom");
  if (DOM) {
    for (let i = 0; i < TILE_COUNT; i++) {
      const c = document.createElement("div");
      c.className = "cap";
      const col = i % COLS, row = (i / COLS) | 0;
      c.style.left = (col * 100 / COLS) + "vw"; c.style.top = (row * 100 / ROWS) + "vh";
      c.style.width = (100 / COLS) + "vw"; c.style.height = (100 / ROWS) + "vh";
      c.textContent = "TILE " + i;
      domLayer.appendChild(c);
    }
  }

  // COLS x ROWS 개의 독립 <video> 디코더를 동적 생성. 각 엘리먼트가 동일 파일을 개별 디코딩.
  const videos = [];
  let playErrors = 0;
  for (let i = 0; i < TILE_COUNT; i++) {
    const v = document.createElement("video");
    v.muted = true;            // 자동재생 정책상 재생 전에 muted 설정 필요
    v.autoplay = true;
    v.loop = true;
    v.playsInline = true;
    v.style.width = tileW;
    v.style.height = tileH;
    if (STAGGER) {
      // 타일별로 타임라인 위치를 고르게 분산 (loop 동기화로 인한 주기적 스톨 방지)
      const frac = i / TILE_COUNT;
      v.addEventListener("loadedmetadata", () => {
        if (isFinite(v.duration) && v.duration > 0) {
          try { v.currentTime = frac * v.duration; } catch (e) { /* seek 실패 무시 */ }
        }
      }, { once: true });
    }
    v.src = SRC;
    v.play().catch(() => { playErrors++; });
    grid.appendChild(v);
    videos.push(v);
  }

  // 스펙 §14 v2: 재생 중 미디어가 animating으로 반영되고 frame-ready wake가 전이
  // 억제되어, 이 페이지는 rAF 없이 임베더가 페인트를 정상 순환한다. 킬스위치
  // SERVO_DISABLE_MEDIA_ANIMATING=1 + SERVO_DISABLE_WAKE_EDGE=1 동시 설정 시에만
  // 동결 재현(진단).
</script>
</body>
</html>
