[package]
name = "wall_cpu_probe"
version = "0.1.0"
edition = "2024"

# (2026-11-18) Its own workspace root on purpose, like the deleted thread_cpu_probe
# (a5a9dd81cb0^). This package sits inside the servo worktree but is not a member of that
# workspace, and cargo refuses to build a package that is neither a member nor excluded.
[workspace]

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",                    # HANDLE, NTSTATUS, FILETIME, LocalFree, CloseHandle
    "Win32_Security",                      # pulled in by the Threading signatures
    "Win32_System_Threading",              # OpenProcess/OpenThread, GetThreadDescription, WaitForSingleObject
    "Win32_System_Kernel",                 # PROCESSOR_NUMBER (gates GetThreadIdealProcessorEx)
    "Win32_System_SystemInformation",      # GetSystemCpuSetInformation, GetLogicalProcessorInformationEx, GetSystemTimePreciseAsFileTime
    "Win32_System_WindowsProgramming",     # QueryThreadCycleTime, QueryProcessCycleTime, QueryIdleProcessorCycleTimeEx
    "Win32_System_Performance",            # QueryPerformanceCounter, PDH (--pdh)
    "Win32_System_ProcessStatus",          # K32GetMappedFileNameW, K32GetModuleInformation
    "Win32_System_LibraryLoader",          # GetModuleHandleW (self check)
    "Wdk_System_SystemInformation",        # NtQuerySystemInformation, NtQueryTimerResolution
] }

[profile.release]
opt-level = 2
