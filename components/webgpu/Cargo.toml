[package]
name = "servo-webgpu"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
description.workspace = true

[lib]
name = "webgpu"
path = "lib.rs"

[dependencies]
arrayvec = { workspace = true, features = ["serde"] }
# Used to serde-clone the non-Clone RenderBundleEncoder when mirroring it onto secondary
# GPU globals for the multi-GPU fan-out (same round-trip as the IPC path).
bincode = "1"
euclid = { workspace = true }
log = { workspace = true }
paint_api = { workspace = true }
pixels = { workspace = true }
rustc-hash = { workspace = true }
servo-base = { workspace = true }
servo-config = { workspace = true }
webgpu_traits = { workspace = true }
webrender_api = { workspace = true }
wgpu-core = { workspace = true, features = ["serde", "wgsl"] }
wgpu-types = { workspace = true }

# We want the wgpu-core Metal backend on macOS and iOS.
[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
wgpu-core = { workspace = true, features = ["metal"] }

[target.'cfg(any(windows, all(unix, not(any(target_os = "macos", target_os = "ios")))))'.dependencies]
wgpu-core = { workspace = true, features = ["gles", "vulkan"] }

[target.'cfg(windows)'.dependencies]
wgpu-core = { workspace = true, features = ["dx12", "vulkan"] }
# Multi-GPU wall GPU-direct present: create/share D3D12 textures so each tile can sample
# its own GPU's render via a DXGI shared handle. `windows` must match wgpu-hal's version
# (0.62) so the D3D12/DXGI types unify with wgpu-hal's raw_device()/texture_from_raw().
wgpu-hal = { version = "29", features = ["dx12"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Security",
] }
