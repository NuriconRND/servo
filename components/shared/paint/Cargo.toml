[package]
name = "servo-paint-api"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
description.workspace = true

[lib]
name = "paint_api"
path = "lib.rs"

[features]
no-wgl = ["surfman/sm-angle-default"]
tracing = ["dep:tracing"]

[dependencies]
bitflags = { workspace = true }
crossbeam-channel = { workspace = true }
dpi = { workspace = true }
embedder_traits = { workspace = true }
euclid = { workspace = true }
gleam = { workspace = true }
glow = { workspace = true }
image = { workspace = true }
ipc-channel = { workspace = true }
log = { workspace = true }
malloc_size_of = { workspace = true }
malloc_size_of_derive = { workspace = true }
parking_lot = { workspace = true }
profile_traits = { workspace = true }
raw-window-handle = { workspace = true }
rustc-hash = { workspace = true }
serde = { workspace = true }
serde_bytes = { workspace = true }
servo-base = { workspace = true }
servo-geometry = { workspace = true }
servo-tracing = { workspace = true }
servo-url = { workspace = true }
smallvec = { workspace = true }
strum = { workspace = true }
stylo = { workspace = true }
stylo_traits = { workspace = true }
surfman = { workspace = true, features = ["sm-x11"] }
tracing = { workspace = true, optional = true }
webrender_api = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { workspace = true, features = ["dxgi", "unknwnbase", "winerror"] }
wio = { workspace = true }

# d3d11_dyn_poc / dcomp_native_poc 예제(§6·§8-1 PoC 게이트) 전용 — 창 생성(winuser 등),
# D3D11 텍스처 생성, DirectComposition(dcomp) 인터롭에 필요한 winapi 기능을 추가한다.
# dev-dependency의 기능은 위 [dependencies] 항목과 합쳐진다(같은 크레이트).
# dcomp 모듈은 d2d1/dwrite/wincodec 등 다수 모듈을 use 하므로 그 전이 폐포까지 모두
# 활성화해야 winapi가 컴파일된다(로컬 winapi-0.3.9 소스의 use 그래프에서 산출).
[target.'cfg(target_os = "windows")'.dev-dependencies]
env_logger = { workspace = true }
winapi = { workspace = true, features = [
    "basetsd",
    "d2d1",
    "d2d1_1",
    "d2d1effectauthor",
    "d2d1effects",
    "d2dbasetypes",
    "d3d11",
    "d3d9types",
    "d3dcommon",
    "dcommon",
    "dcomp",
    "dcompanimation",
    "dcomptypes",
    "documenttarget",
    "dwrite",
    "dxgi",
    "dxgi1_2",
    "dxgiformat",
    "dxgitype",
    "excpt",
    "guiddef",
    "ktmtypes",
    "libloaderapi",
    "limits",
    "minwinbase",
    "minwindef",
    "ntdef",
    "ntstatus",
    "oaidl",
    "objidlbase",
    "ocidl",
    "propidl",
    "rpcndr",
    "unknwnbase",
    "vadefs",
    "vcruntime",
    "wincodec",
    "windef",
    "winerror",
    "wingdi",
    "winnt",
    "winuser",
    "wtypes",
    "wtypesbase",
] }
