[package]
name = "servo-paint"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true
rust-version.workspace = true
repository.workspace = true
description.workspace = true

[lib]
name = "paint"
path = "lib.rs"

[features]
default = []
tracing = ["dep:tracing"]
webgpu = ["dep:webgpu"]
webxr = ["dep:webxr", "dep:webxr-api"]

[lints.clippy]
unwrap_used = "deny"
panic = "deny"

[dependencies]
bitflags = { workspace = true }
crossbeam-channel = { workspace = true }
dpi = { workspace = true }
embedder_traits = { workspace = true }
euclid = { workspace = true }
gleam = { workspace = true }
image = { workspace = true }
ipc-channel = { workspace = true }
log = { workspace = true }
malloc_size_of = { workspace = true }
media = { workspace = true }
paint_api = { workspace = true }
profile_traits = { workspace = true }
rayon = { workspace = true }
rustc-hash = { workspace = true }
servo-allocator = { workspace = true }
servo-base = { workspace = true }
servo-canvas-traits = { workspace = true }
servo-config = { workspace = true }
servo-constellation-traits = { workspace = true }
servo-geometry = { workspace = true }
servo-tracing = { workspace = true }
smallvec = { workspace = true }
stylo_traits = { workspace = true }
surfman = { workspace = true }
timers = { workspace = true }
tracing = { workspace = true, optional = true }
webgl = { workspace = true }
webgpu = { workspace = true, optional = true }
webrender = { workspace = true }
webrender_api = { workspace = true }
webxr = { workspace = true, optional = true }
webxr-api = { workspace = true, optional = true }
wr_malloc_size_of = { workspace = true }

# DirectComposition Native Compositor(dcomp_compositor.rs)에 필요한 winapi 기능.
# winapi 0.3.9의 각 피처는 빈 배열이라 전이 의존을 자동으로 켜주지 않는데, `dcomp` 모듈은
# d2d1/d2d1_1/dwrite/wincodec/dxgi1_2/dcompanimation/... 를 use하므로 그 전이 폐포까지 모두
# 활성화해야 winapi가 컴파일된다. 아래 목록은 실기 4/4 PASS한 PoC(servo-paint-api dev-deps)에서
# 검증된 dcomp 전이 폐포에 기존 processthreadsapi/winbase를 합친 것이다.
[target.'cfg(windows)'.dependencies]
winapi = { workspace = true, features = [
    "basetsd",
    "d2d1",
    "d2d1_1",
    "d2d1effectauthor",
    "d2d1effects",
    "d2dbasetypes",
    "d3d11",
    "d3d11_1",
    "d3d9types",
    "d3dcommon",
    "d3dcompiler",
    "dcommon",
    "dcomp",
    "dcompanimation",
    "dcomptypes",
    "documenttarget",
    "dwrite",
    "dxgi",
    "dxgi1_2",
    "dxgiformat",
    "dxgitype",
    "excpt",
    "guiddef",
    "ktmtypes",
    "libloaderapi",
    "limits",
    "minwinbase",
    "minwindef",
    "ntdef",
    "ntstatus",
    "oaidl",
    "objidlbase",
    "ocidl",
    "processthreadsapi",
    "propidl",
    "rpcndr",
    "unknwnbase",
    "vadefs",
    "vcruntime",
    "wincodec",
    "winbase",
    "windef",
    "winerror",
    "wingdi",
    "winnt",
    "winuser",
    "wtypes",
    "wtypesbase",
] }

[dev-dependencies]
surfman = { workspace = true }
